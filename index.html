<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yahtzee">
<meta name="theme-color" content="#1a1a2e">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<title>Yahtzee</title>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
  "postprocessing":"https://cdn.jsdelivr.net/npm/postprocessing@6.39.5/build/index.js"
}}
</script>
<script type="module">
// three dropped its UMD build, so the libraries load as modules and are
// published onto window for the classic game script below. Module scripts are
// deferred, so this runs after that script has defined __boot().
import * as THREE from 'three';
import * as POSTPROCESSING from 'postprocessing';
window.THREE=THREE;
window.POSTPROCESSING=POSTPROCESSING;
if(window.__boot)window.__boot(); else window.__threeReady=true;
</script>
<style>
:root{
  --max-rolls:3;--upper-bonus-score:35;--upper-bonus-target:63;
  --bg:#1a1a2e;--surface:#16213e;--accent:#e94560;--accent2:#f5a623;
  --text:#eaeaea;--muted:#7a8499;--green:#40916c;--radius:10px;
  /* Fallbacks only — fitDice() measures the panel and overwrites these at runtime
     so the dice always fill whatever vertical space is actually available. */
  --surface-glass:rgba(22,33,62,.74);
  --slot:120px;
  --die:117px;
  --dice-vshift:0px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text)}
/* Animated shader backdrop; sits above the body fill but under everything else */
#bg-stage{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}

.app{
  position:relative;z-index:1;
  display:flex;flex-direction:column;
  height:100vh;height:-webkit-fill-available;
  max-width:430px;margin:0 auto;
  padding:env(safe-area-inset-top,4px) 5px env(safe-area-inset-bottom,3px);
  gap:3px;
}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:0 2px;flex-shrink:0;flex-wrap:nowrap;overflow:hidden}
.header h1{font-size:40px;font-weight:700;color:var(--accent);letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:1}
.total-wrap{text-align:right;flex-shrink:0}
.total-wrap .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.total-wrap .val{font-size:40px;font-weight:700;line-height:1}

/* Main row */
.main-row{display:flex;gap:4px;flex:1;min-height:0}
/* swap: dice right */
.main-row.swapped{flex-direction:row-reverse}

/* ── Dice panel ── */
.dice-panel{
  width:calc(var(--slot) + 6px);flex-shrink:0;
  background:var(--surface-glass,var(--surface));border-radius:var(--radius);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1px 3px;
  position:relative;
}
.die-slot{width:var(--slot);height:var(--slot);position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin:var(--slot-squeeze,0) 0;transform:translateY(var(--dice-vshift,0px))}
/* The wrapper no longer holds a canvas — it is the invisible layout box and
   tap target that the shared WebGL stage positions each die from. */
.die-wrap{width:var(--die);height:var(--die);cursor:pointer;position:relative;user-select:none;-webkit-user-select:none;border-radius:calc(var(--die) * .085)}
.die-wrap:active{transform:scale(.86)}
.die-wrap.rolling{opacity:1}/* Three.js handles roll animation */
.held-ring{position:absolute;inset:-2px;border-radius:calc(var(--die) * .085);border:2px solid #40916c;pointer-events:none;z-index:2}
/* One canvas for all five dice, behind the controls and the held rings */
.dice-stage{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
.btn-swap{position:absolute;top:5px;left:5px;right:5px;width:calc(100% - 10px);background:rgba(255,255,255,.1);color:var(--text);border:none;border-radius:8px;padding:7px 0;font-size:22px;cursor:pointer;-webkit-appearance:none;z-index:2}
.btn-swap:active{background:rgba(255,255,255,.18)}
.dice-controls{margin-top:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;transform:translateY(var(--dice-vshift,0px));position:relative;z-index:2}
.pips{display:flex;gap:3px}
.pip{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.14);transition:background .2s}
.pip.on{background:var(--accent)}
.btn-roll{
  background:var(--accent);color:#fff;border:none;border-radius:7px;
  padding:21px 0;width:100%;font-size:15px;font-weight:600;
  cursor:pointer;-webkit-appearance:none;transition:transform .1s,opacity .15s;
}
.btn-roll:active{transform:scale(.93)}
.btn-roll:disabled{opacity:.32;cursor:default}

/* ── Scores panel ── */
.scores-panel{flex:1;min-width:0;background:var(--surface-glass,var(--surface));border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.sec-header{display:flex;align-items:center;justify-content:space-between;padding:2px 6px;background:rgba(0,0,0,.22);flex-shrink:0;gap:4px}
.sec-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.hdr-btns{display:flex;gap:4px}
.btn-sm{background:rgba(255,255,255,.1);color:var(--text);border:none;border-radius:5px;padding:2px 7px;font-size:10px;font-weight:600;cursor:pointer;-webkit-appearance:none;white-space:nowrap}
.btn-sm:active{background:rgba(255,255,255,.2)}

.scores-list{flex:1;display:flex;flex-direction:column;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}

/* Score rows */
.score-row{
  display:flex;align-items:center;
  padding:0 6px;gap:3px;
  border-bottom:1px solid rgba(0,0,0,.2);
  cursor:default;
  flex:1 1 0;min-height:22px;
  position:relative;overflow:hidden;
  transform:perspective(600px) rotateX(0deg);
  transition:transform .15s;
}
.score-row .row-canvas{position:absolute;inset:0;pointer-events:none;z-index:0}
.row-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.score-row.clickable{cursor:pointer}
.score-row.clickable:active{filter:brightness(1.18)}
.score-row.used{cursor:default;background:#0d0f1a !important;}
.score-row.used .s-name{color:rgba(255,255,255,.38)}
.score-row.used .s-val{color:rgba(200,185,80,.65);text-shadow:none}
.s-name{
  flex:1;font-size:11px;font-weight:500;
  color:rgba(255,255,255,.88);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  position:relative;z-index:1;
  text-shadow:0 1px 4px rgba(0,0,0,.7);
}
.s-val{
  font-size:14px;font-weight:700;
  min-width:22px;text-align:right;
  position:relative;z-index:1;
  text-shadow:0 1px 4px rgba(0,0,0,.8);
  line-height:1;
}
.sv-blank{color:rgba(255,255,255,.3)}
.sv-zero{color:rgba(255,255,255,.3)}
.sv-scored{color:rgba(200,185,80,.7)}
.sv-avail{color:#fff}
.sv-certain{color:#74c69d}

/* Section divider */
.sec-divider{display:flex;align-items:center;padding:2px 7px;background:rgba(0,0,0,.25);flex-shrink:0;border-top:1px solid rgba(255,255,255,.04)}
.sec-divider .sec-lbl{color:var(--muted)}

/* Bonus row */
.bonus-row-inner{display:flex;align-items:center;gap:4px;padding:2px 7px;border-bottom:1px solid rgba(0,0,0,.2);flex-shrink:0;background:rgba(0,0,0,.12)}
.bonus-lbl{font-size:9px;color:var(--muted);white-space:nowrap}
.bonus-bar-bg{flex:1;height:10px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden}
.bonus-bar-fill{height:100%;background:linear-gradient(90deg,#2d8a5e,#7ab648,#f5a623);border-radius:5px;transition:width .4s}
.bonus-amt{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;line-height:1}

/* Footer */
.footer{display:flex;gap:5px;flex-shrink:0}
.btn-new{flex:1;background:rgba(255,255,255,.07);color:var(--text);border:none;border-radius:8px;padding:7px;font-size:13px;font-weight:500;cursor:pointer;-webkit-appearance:none}
.btn-new:active{background:rgba(255,255,255,.13)}
.btn-hist{background:rgba(255,255,255,.07);color:var(--text);border:none;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;-webkit-appearance:none;white-space:nowrap}
.btn-hist:active{background:rgba(255,255,255,.13)}

/* Overlays */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);align-items:center;justify-content:center;z-index:100;padding:24px}
.overlay.show{display:flex}

/* Settings overlay */
.settings-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;align-items:flex-end;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.settings-overlay.show{display:flex}
.settings-card{background:#16213e;border-radius:18px 18px 0 0;padding:16px 20px 28px;width:100%;max-width:430px}
.settings-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.settings-close{background:rgba(255,255,255,.1);border:none;color:var(--text);border-radius:6px;padding:3px 12px;font-size:12px;cursor:pointer;-webkit-appearance:none}
.setting-row{margin-bottom:12px}
.setting-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-bottom:5px}
.setting-label span:last-child{color:var(--text);font-weight:600;font-size:12px;min-width:30px;text-align:right}
input[type=range].setting-slider{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.15);border-radius:2px;outline:none}
input[type=range].setting-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer}
/* Effect toggles — one per group so each can be compared on/off */
.fx-toggles{display:flex;flex-wrap:wrap;gap:6px}
.fx-tgl{flex:1 1 auto;background:rgba(255,255,255,.06);color:rgba(255,255,255,.45);
  border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:7px 10px;
  font-size:11px;font-weight:600;cursor:pointer;-webkit-appearance:none;
  display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.fx-tgl::before{content:'';width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18);flex-shrink:0}
.fx-tgl.on{background:rgba(245,166,35,.14);border-color:rgba(245,166,35,.4);color:#f5a623}
.fx-tgl.on::before{background:#f5a623;box-shadow:0 0 6px rgba(245,166,35,.9)}
.settings-reset{margin-top:6px;width:100%;background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);border:none;border-radius:8px;padding:8px;font-size:12px;cursor:pointer;-webkit-appearance:none}
.settings-reset:active{background:rgba(255,255,255,.12)}
.ov-card{background:var(--surface);border-radius:18px;padding:24px 20px;text-align:center;width:100%;max-width:300px}
.ov-title{font-size:24px;font-weight:700;color:var(--accent);margin-bottom:4px}
.ov-score{font-size:50px;font-weight:700;margin-bottom:2px}
.ov-sub{font-size:13px;color:var(--muted);margin-bottom:5px}
.ov-rank{font-size:13px;color:var(--accent2);margin-bottom:18px;min-height:16px}
.ov-btns{display:flex;gap:8px}
.ov-btn{flex:1;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;-webkit-appearance:none}
.ov-btn.primary{background:var(--accent);color:#fff}
.ov-btn.secondary{background:rgba(255,255,255,.1);color:var(--text)}

.hist-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;flex-direction:column;padding:env(safe-area-inset-top,14px) 0 env(safe-area-inset-bottom,14px)}
.hist-overlay.show{display:flex}
.hist-header{display:flex;align-items:center;justify-content:space-between;padding:0 16px 10px}
.hist-title{font-size:17px;font-weight:700}
.hist-close{background:rgba(255,255,255,.1);border:none;color:var(--text);border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer;-webkit-appearance:none}
.hist-stats{display:flex;gap:6px;padding:0 16px 12px}
.stat-box{flex:1;text-align:center;padding:7px 4px;background:rgba(255,255,255,.05);border-radius:8px}
.stat-val{font-size:17px;font-weight:700}
.stat-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.hist-chart-wrap{flex:1;padding:0 12px;overflow:hidden;position:relative}
.hist-empty{display:flex;align-items:center;justify-content:center;height:100%;font-size:14px;color:var(--muted)}
.hist-clear{background:rgba(233,69,96,.12);color:rgba(255,80,100,.6);border:none;border-radius:6px;padding:3px 8px;font-size:10px;cursor:pointer;-webkit-appearance:none}
.hist-clear:active{background:rgba(233,69,96,.25)}
.hist-bucket-bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 16px 2px;flex-shrink:0}
.btn-bucket{background:rgba(255,255,255,.1);color:var(--text);border:none;border-radius:8px;width:40px;height:32px;font-size:20px;font-weight:300;cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;line-height:1}
.btn-bucket:active{background:rgba(255,255,255,.2)}
.bucket-lbl{font-size:11px;color:var(--muted);min-width:60px;text-align:center}
.ver-toggle{margin:8px 16px 0;background:none;border:none;color:rgba(255,255,255,.2);font-size:10px;cursor:pointer;-webkit-appearance:none;text-align:left;padding:2px 0;letter-spacing:.03em}
.ver-toggle:active{color:rgba(255,255,255,.4)}
.ver-log{margin:0 16px;overflow:hidden;transition:max-height .3s ease}
.ver-log.hidden{max-height:0}
.ver-log.visible{max-height:400px}
.ver-entry{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.ver-entry:last-child{border-bottom:none}
.ver-num{font-size:10px;font-weight:700;color:rgba(255,255,255,.4);margin-bottom:2px}
.ver-note{font-size:10px;color:rgba(255,255,255,.22);line-height:1.5}

/* Yahtzee celebration — riveted steel plate, welding sparks, warning beacon */
.yz-celebrate{position:fixed;inset:0;z-index:500;pointer-events:none;display:none;align-items:center;justify-content:center;overflow:hidden}
.yz-celebrate.show{display:flex}
.yz-celebrate canvas{position:absolute;inset:0;width:100%;height:100%}

.yz-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(255,244,222,.95),rgba(255,244,222,0) 62%);opacity:0}
.yz-flash.go{animation:yzFlash .4s ease-out forwards}
@keyframes yzFlash{0%{opacity:1}100%{opacity:0}}

.yz-beacon{position:absolute;left:0;right:0;height:9px;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(245,166,35,.85) 35%,rgba(233,69,96,.85) 65%,transparent)}
.yz-beacon.top{top:0}
.yz-beacon.bottom{bottom:0}
.yz-beacon.go{animation:yzBeacon 550ms ease-in-out 3}
@keyframes yzBeacon{0%,100%{opacity:0}50%{opacity:1}}

.yz-plate{position:relative;background:linear-gradient(155deg,#3d4452,#161a21 68%);
  border:1px solid rgba(255,255,255,.09);border-radius:5px;
  padding:16px 26px 18px;max-width:90vw;opacity:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -4px 8px rgba(0,0,0,.6),0 12px 34px rgba(0,0,0,.6);
}
.yz-plate.stamp{animation:yzStamp .5s cubic-bezier(.22,.9,.32,1.05) forwards}
@keyframes yzStamp{
  0%{opacity:0;transform:scale(1.55)}
  55%{opacity:1;transform:scale(.93)}
  80%{transform:scale(1.03)}
  100%{opacity:1;transform:scale(1)}
}
.yz-plate.fade{animation:yzPlateFade .4s ease forwards}
@keyframes yzPlateFade{to{opacity:0;transform:scale(.9) translateY(-10px)}}

.yz-stripe{position:absolute;left:0;right:0;height:6px;opacity:.92;
  background:repeating-linear-gradient(45deg,#f5a623 0 9px,#161a21 9px 18px)}
.yz-stripe.top{top:0;border-radius:5px 5px 0 0}
.yz-stripe.bottom{bottom:0;border-radius:0 0 5px 5px}

.yz-rivet{position:absolute;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#d7dbe2,#5b6272 62%,#20242c);
  box-shadow:0 1px 1px rgba(0,0,0,.65)}
.yz-rivet.tl{top:10px;left:10px}
.yz-rivet.tr{top:10px;right:10px}
.yz-rivet.bl{bottom:10px;left:10px}
.yz-rivet.br{bottom:10px;right:10px}

.yz-banner{position:relative;font-weight:800;text-align:center;
  text-transform:uppercase;letter-spacing:.05em;line-height:1.08;
  white-space:normal;color:#f5a623;
  text-shadow:0 1px 0 rgba(255,255,255,.2),0 2px 2px rgba(0,0,0,.85),0 0 14px rgba(245,166,35,.3);
  -webkit-text-stroke:1px rgba(0,0,0,.45);
}

/* Screen shake is driven from JS now so its strength can scale with the event
   (hold tap < scoring < Yahtzee) instead of being one fixed keyframe. */

/* Floating score text */
.score-pop{position:fixed;z-index:520;pointer-events:none;
  font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;
  color:#f5a623;
  text-shadow:0 2px 6px rgba(0,0,0,.85),0 0 14px rgba(245,166,35,.45);
  -webkit-text-stroke:1px rgba(0,0,0,.4);
  opacity:0;transform:translate(-50%,-50%) scale(.6);
  animation:scorePop 1.05s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes scorePop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  22%{opacity:1;transform:translate(-50%,-62%) scale(1.14)}
  38%{opacity:1;transform:translate(-50%,-66%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-125%) scale(1.02)}
}
</style>
</head>
<body>
<canvas id="bg-stage"></canvas>
<div class="app">
  <div class="header">
    <h1>Yahtzee</h1>
    <div class="total-wrap"><div class="lbl">Score <span id="app-ver" style="opacity:.4;font-size:8px;"></span></div><div class="val" id="total">0</div></div>
  </div>
  <div class="main-row" id="main-row">
    <div class="dice-panel" id="dice-panel"></div>
    <div class="scores-panel">
      <div class="sec-header">
        <span class="sec-lbl">Upper</span>
        <div class="hdr-btns">
          <button class="btn-sm" onclick="showSettings()">&#9881;</button>
        </div>
      </div>
      <div class="scores-list" id="scores-list"></div>
    </div>
  </div>
  <div class="footer">
    <button class="btn-new" onclick="newGame()">New game</button>
    <button class="btn-hist" onclick="showHistory()">History</button>
  </div>
</div>

<div class="settings-overlay" id="settings-overlay">
  <div class="settings-card">
    <div class="settings-title">
      Layout settings
      <button class="settings-close" onclick="closeSettings()">Done</button>
    </div>
    <div class="setting-row">
      <div class="setting-label"><span>Row height</span><span id="lbl-row-height">32</span></div>
      <input type="range" class="setting-slider" id="sl-row-height" min="22" max="52" step="1" oninput="applySettings()">
    </div>
    <div class="setting-row">
      <div class="setting-label"><span>Header height</span><span id="lbl-header">20</span></div>
      <input type="range" class="setting-slider" id="sl-header" min="14" max="130" step="1" oninput="applySettings()">
    </div>
    <div class="setting-row">
      <div class="setting-label"><span>Dice size</span><span id="lbl-dice-size">100</span>%</div>
      <input type="range" class="setting-slider" id="sl-dice-size" min="50" max="100" step="2" oninput="applySettings()">
    </div>
    <div class="setting-row">
      <div class="setting-label"><span>Dice spacing</span><span id="lbl-dice-gap">0</span>px</div>
      <input type="range" class="setting-slider" id="sl-dice-gap" min="-18" max="30" step="1" oninput="applySettings()">
    </div>
    <div class="setting-row">
      <div class="setting-label"><span>Dice position</span><span id="lbl-dice-vshift">0</span>px</div>
      <input type="range" class="setting-slider" id="sl-dice-vshift" min="-80" max="80" step="1" oninput="applySettings()">
    </div>
    <div class="setting-row">
      <div class="setting-label"><span>Shake sensitivity</span><span id="lbl-shake-sens">5</span></div>
      <input type="range" class="setting-slider" id="sl-shake-sens" min="1" max="10" step="1" oninput="applySettings()">
    </div>
    <div class="setting-row">
      <div class="setting-label"><span>Effects</span><span></span></div>
      <div class="fx-toggles">

<script>
// ── Categories ───────────────────────────────────────────────
var UPPER_CATS=[
  {id:'ones',  name:'Ones',        fn:function(d){return sA(d.filter(function(v){return v===1}))}},
  {id:'twos',  name:'Twos',        fn:function(d){return sA(d.filter(function(v){return v===2}))}},
  {id:'threes',name:'Threes',      fn:function(d){return sA(d.filter(function(v){return v===3}))}},
  {id:'fours', name:'Fours',       fn:function(d){return sA(d.filter(function(v){return v===4}))}},
  {id:'fives', name:'Fives',       fn:function(d){return sA(d.filter(function(v){return v===5}))}},
  {id:'sixes', name:'Sixes',       fn:function(d){return sA(d.filter(function(v){return v===6}))}},
];
var LOWER_CATS=[
  {id:'3k',name:'3 of a kind',fn:function(d){return hasCt(d,3)?sA(d):0}},
  {id:'4k',name:'4 of a kind',fn:function(d){return hasCt(d,4)?sA(d):0}},
  {id:'fh',name:'Full house', fn:function(d){var v=Object.values(cm(d)).sort();return v.length===2&&v[0]===2?25:0}},
  {id:'ss',name:'Sm. straight',fn:function(d){return hasSeq(d,4)?30:0}},
  {id:'ls',name:'Lg. straight',fn:function(d){return hasSeq(d,5)?40:0}},
  {id:'yh',name:'Yahtzee!',   fn:function(d){return Object.values(cm(d)).length===1?50:0}},
  {id:'ch',name:'Chance',     fn:function(d){return sA(d)}},
];

// ── Helpers ──────────────────────────────────────────────────
function sA(a){return a.length?a.reduce(function(x,y){return x+y},0):0}
function cm(d){var c={};d.forEach(function(v){c[v]=(c[v]||0)+1});return c}
function hasCt(d,n){return Object.values(cm(d)).some(function(v){return v>=n})}
function hasSeq(d,n){
  var u=[];d.forEach(function(v){if(u.indexOf(v)<0)u.push(v)});u.sort(function(a,b){return a-b});
  for(var i=0;i<=u.length-n;i++){var ok=true;for(var j=1;j<n;j++)if(u[i+j]!==u[i]+j){ok=false;break}if(ok)return true}
  return false;
}
function rnd(){return Math.ceil(Math.random()*6)}
function clamp01(x){return x<0?0:x>1?1:x}

// ── Three.js Dice System (one renderer, DOM-synced) ───────────
// All five dice are drawn by a single WebGLRenderer into one canvas that
// overlays the dice panel. The .die-slot/.die-wrap DOM stays exactly where it
// was and acts as the layout + hit-target layer: every frame each die mesh is
// positioned and sized from its wrapper's bounding box. That means CSS sizing,
// the dice-size/spacing/position sliders, the FLIP reorder animation,
// swap-sides and the :active tap-squash all keep driving the 3D dice for free,
// and we go from 5 WebGL contexts + 5 RAF loops down to 1 of each.
var stage=null;          // the shared renderer/scene/camera + die meshes
var threeCubes={};       // origIdx -> die mesh
var threeAnimating={};   // origIdx -> {active,t,targetQuat,onDone}

// Pip positions on each face of a unit cube
// Face order: +X=1, -X=6, +Y=2, -Y=5, +Z=3, -Z=4
var PIP_FACES={
  1:{faceIdx:0,pips:[[0,0]]},
  2:{faceIdx:2,pips:[[-0.25,-0.25],[0.25,0.25]]},
  3:{faceIdx:4,pips:[[0,0],[-0.28,-0.28],[0.28,0.28]]},
  4:{faceIdx:1,pips:[[-0.25,-0.25],[0.25,-0.25],[-0.25,0.25],[0.25,0.25]]},
  5:{faceIdx:3,pips:[[0,0],[-0.25,-0.25],[0.25,-0.25],[-0.25,0.25],[0.25,0.25]]},
  6:{faceIdx:5,pips:[[-0.25,-0.3],[0.25,-0.3],[-0.25,0],[0.25,0],[-0.25,0.3],[0.25,0.3]]}
};

// Face rotations so each face points toward camera (+Z). Built in
// initThreeConsts() because THREE now loads as a deferred module.
var FACE_QUATS=null;
// Map die value to face quaternion index, and back
var VALUE_TO_FACE={1:0,2:2,3:4,4:5,5:3,6:1};
var FACE_TO_VALUE={};
for(var _v=1;_v<=6;_v++)FACE_TO_VALUE[VALUE_TO_FACE[_v]]=_v;

// Face textures only depend on (value, held), so there are just 14 of them.
// Cache instead of rebuilding six canvases per die on every roll and hold.
var PIP_TEX={};
function pipTexture(value,isHeld){
  var key=value+'_'+(isHeld?1:0);
  if(PIP_TEX[key])return PIP_TEX[key];
  var size=256;
  var can=document.createElement('canvas');can.width=size;can.height=size;
  var ctx=can.getContext('2d');
  var r=size*0.12;
  var isEmpty=!(value>0);
  if(isEmpty)ctx.globalAlpha=0.25;
  ctx.fillStyle=isHeld?'#183d2c':'#f0e8d0';
  // Rounded rect
  ctx.beginPath();
  ctx.moveTo(r,0);ctx.lineTo(size-r,0);ctx.quadraticCurveTo(size,0,size,r);
  ctx.lineTo(size,size-r);ctx.quadraticCurveTo(size,size,size-r,size);
  ctx.lineTo(r,size);ctx.quadraticCurveTo(0,size,0,size-r);
  ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);ctx.closePath();
  ctx.fill();
  if(!isEmpty){
    // Border
    ctx.strokeStyle=isHeld?'#40916c':'#c0a87a';ctx.lineWidth=8;ctx.stroke();
    // Pips
    var pipColor=isHeld?'#74c69d':'#1a1a2e';
    var layout=PIP_FACES[value]?PIP_FACES[value].pips:[];
    var pr=size*0.085;
    layout.forEach(function(p){
      var cx=(p[0]+0.5)*size,cy=(p[1]+0.5)*size;
      ctx.beginPath();ctx.arc(cx,cy,pr,0,Math.PI*2);
      ctx.fillStyle=pipColor;ctx.fill();
    });
  }
  var tex=new THREE.CanvasTexture(can);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.anisotropy=4;
  // The same texture doubles as the bump map: three samples bumpMap as raw
  // height data regardless of .encoding, so the dark pips read as drilled
  // recesses rather than painted dots.
  PIP_TEX[key]=tex;
  return tex;
}

// A small painted environment — dark floor, lit ceiling, two overhead strip
// lights. Run through PMREM it becomes the image the clearcoat reflects, which
// is what makes the dice read as solid objects instead of flat boxes.
function makeStudioEnv(renderer){
  var c=document.createElement('canvas');c.width=256;c.height=128;
  var x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,0,128);
  g.addColorStop(0,'#b9c2d2');g.addColorStop(0.46,'#5c636e');
  g.addColorStop(0.54,'#262b35');g.addColorStop(1,'#10131a');
  x.fillStyle=g;x.fillRect(0,0,256,128);
  [[28,14,96,11],[150,9,74,9]].forEach(function(s){
    var lg=x.createLinearGradient(0,s[1],0,s[1]+s[3]);
    lg.addColorStop(0,'rgba(255,246,228,1)');
    lg.addColorStop(1,'rgba(255,246,228,0)');
    x.fillStyle=lg;x.fillRect(s[0],s[1],s[2],s[3]);
  });
  var tex=new THREE.CanvasTexture(c);
  tex.mapping=THREE.EquirectangularReflectionMapping;
  tex.colorSpace=THREE.SRGBColorSpace;
  var pm=new THREE.PMREMGenerator(renderer);
  var env=pm.fromEquirectangular(tex).texture;
  pm.dispose();tex.dispose();
  return env;
}

// Cube edge as a fraction of its wrapper box. Dice shrink slightly while
// tumbling so the spinning corners stay clear of their neighbours.
var DIE_REST=0.80;
var DIE_ROLL=0.66;
var STAGE_FOV=24;
var STAGE_DIST=18;
var DIE_GEO=null;

function initThreeConsts(){
  if(FACE_QUATS)return;
  FACE_QUATS=[
    new THREE.Quaternion().setFromEuler(new THREE.Euler(0,-Math.PI/2,0)),   // +X face (1)
    new THREE.Quaternion().setFromEuler(new THREE.Euler(0,Math.PI/2,0)),    // -X face (6)
    new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI/2,0,0)),    // +Y face (2)
    new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI/2,0,0)),   // -Y face (5)
    new THREE.Quaternion(),                                                  // +Z face (3)
    new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI,0,0))       // -Z face (4)
  ];
  DIE_GEO=new THREE.BoxGeometry(1,1,1);
}


// ── Dice sparks ──────────────────────────────────────────────────────────────
// A fixed pool of additively-blended points inside the dice scene, so landing
// sparks pick up the bloom. Recycled round-robin; nothing is allocated per hit.
var SPARK_MAX=240;
function initSparks(){
  var st=stage;if(!st||st.sparks)return;
  var pos=new Float32Array(SPARK_MAX*3),col=new Float32Array(SPARK_MAX*3);
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  var pts=new THREE.Points(g,new THREE.PointsMaterial({
    size:0.075,vertexColors:true,transparent:true,depthWrite:false,
    blending:THREE.AdditiveBlending,sizeAttenuation:true
  }));
  pts.frustumCulled=false;pts.visible=false;
  st.scene.add(pts);
  st.sparks={pts:pts,pos:pos,col:col,
             vel:new Float32Array(SPARK_MAX*3),rgb:new Float32Array(SPARK_MAX*3),
             life:new Float32Array(SPARK_MAX),max:new Float32Array(SPARK_MAX),next:0};
  for(var i=0;i<SPARK_MAX;i++)st.sparks.life[i]=1e9;   // start all dead
}

function emitSparks3D(x,y,z,n,spread){
  var st=stage;if(!st||!st.sparks||!fxOn('fxParticles'))return;
  var S=st.sparks;
  spread=spread||0.25;
  for(var k=0;k<n;k++){
    var i=S.next;S.next=(S.next+1)%SPARK_MAX;
    var a=Math.random()*Math.PI*2,sp=(0.014+Math.random()*0.030);
    S.pos[i*3]=x+(Math.random()-0.5)*spread*0.6;
    S.pos[i*3+1]=y+(Math.random()-0.5)*spread*0.12;
    S.pos[i*3+2]=z;
    S.vel[i*3]=Math.cos(a)*sp*1.5;
    S.vel[i*3+1]=Math.abs(Math.sin(a))*sp*0.8+0.010;
    S.vel[i*3+2]=(Math.random()-0.5)*sp*0.4;
    S.life[i]=0;S.max[i]=18+Math.random()*20;
    var warm=Math.random();
    S.rgb[i*3]=1;S.rgb[i*3+1]=0.70+warm*0.26;S.rgb[i*3+2]=0.25+warm*0.45;
  }
  st.dirty=true;
}

function updateSparks(step){
  var st=stage;if(!st||!st.sparks)return false;
  var S=st.sparks,any=false;
  for(var i=0;i<SPARK_MAX;i++){
    if(S.life[i]>=S.max[i]){S.col[i*3]=S.col[i*3+1]=S.col[i*3+2]=0;continue;}
    any=true;
    S.life[i]+=step;
    S.vel[i*3+1]-=0.00052*step;                 // gravity
    S.pos[i*3]  +=S.vel[i*3]*step;
    S.pos[i*3+1]+=S.vel[i*3+1]*step;
    S.pos[i*3+2]+=S.vel[i*3+2]*step;
    var f=1-S.life[i]/S.max[i];f*=f;
    S.col[i*3]=S.rgb[i*3]*f;S.col[i*3+1]=S.rgb[i*3+1]*f;S.col[i*3+2]=S.rgb[i*3+2]*f;
  }
  S.pts.visible=any;
  if(any){
    S.pts.geometry.attributes.position.needsUpdate=true;
    S.pts.geometry.attributes.color.needsUpdate=true;
  }
  return any;
}

// Nudge the camera in for a beat on a big moment.
function cameraPush(amount){
  var st=stage;if(!st)return;
  st.push=Math.max(st.push||0,amount);
  st.dirty=true;
}

// ── Post-processing ──────────────────────────────────────────────────────────
// pmndrs postprocessing rather than three's EffectComposer: one fullscreen
// pass for all three effects, and mipmap bloom at half resolution.
var BLOOM_SCALE=0.5;
function buildComposer(){
  var st=stage;if(!st||!window.POSTPROCESSING)return;
  var PP=POSTPROCESSING;
  var composer=new PP.EffectComposer(st.renderer,{
    frameBufferType:THREE.HalfFloatType,
    multisampling:0
  });
  composer.addPass(new PP.RenderPass(st.scene,st.camera));
  var bloom=new PP.BloomEffect({
    intensity:1.15,
    luminanceThreshold:0.78,   // only the hot highlights, not the whole die face
    luminanceSmoothing:0.3,
    mipmapBlur:true,
    radius:0.62,
    resolutionScale:BLOOM_SCALE
  });
  var ca=new PP.ChromaticAberrationEffect({
    offset:new THREE.Vector2(0,0),
    radialModulation:true,
    modulationOffset:0.25
  });
  var vignette=new PP.VignetteEffect({offset:0.40,darkness:0.26});
  composer.addPass(new PP.EffectPass(st.camera,bloom,ca,vignette));
  st.composer=composer;st.bloom=bloom;st.ca=ca;st.vignette=vignette;
  if(st.cw&&st.ch)composer.setSize(st.cw,st.ch);
}

// Kick a chromatic-aberration pulse — the Yahtzee equivalent of a Tetris.
function pulseAberration(strength){
  var st=stage;if(!st)return;
  st.caPeak=strength;st.caPulse=1;st.dirty=true;
}

function initDiceStage(){
  if(stage)return stage;
  initThreeConsts();
  var panel=document.getElementById('dice-panel');
  if(!panel)return null;

  var canvas=document.createElement('canvas');
  canvas.className='dice-stage';
  panel.appendChild(canvas);

  var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setClearColor(0x000000,0);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=0.98;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  // The dice are stationary most of the time, so the shadow map is refreshed
  // explicitly when something actually moves instead of every frame.
  renderer.shadowMap.autoUpdate=false;
  renderer.shadowMap.needsUpdate=true;

  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(STAGE_FOV,1,0.1,200);
  camera.position.set(0,0,STAGE_DIST);

  var env=makeStudioEnv(renderer);
  scene.environment=env;

  var amb=new THREE.AmbientLight(0xffffff,1.05);scene.add(amb);
  var key=new THREE.DirectionalLight(0xfff0dd,2.85);
  key.position.set(3.2,5.2,9.5);
  key.castShadow=true;
  key.shadow.mapSize.set(512,512);
  key.shadow.camera.near=1;key.shadow.camera.far=48;
  key.shadow.bias=-0.0016;key.shadow.radius=4;
  scene.add(key);
  var fill=new THREE.DirectionalLight(0x9fc0ff,0.80);
  fill.position.set(-5,-2,4);scene.add(fill);

  // Shadow-only plane: leaves the panel's CSS background alone and just
  // darkens where the dice shade it.
  var catcher=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.ShadowMaterial({opacity:0.20}));
  catcher.position.z=-0.6;catcher.receiveShadow=true;scene.add(catcher);

  stage={renderer:renderer,scene:scene,camera:camera,canvas:canvas,panel:panel,
         env:env,amb:amb,key:key,fill:fill,catcher:catcher,
         dies:{},wpp:1,needLayout:true,lastLayout:0,reordering:false,raf:null,
         composer:null,bloom:null,vignette:null,ca:null,caPulse:0,caPeak:0,
         sparks:null,push:0};
  buildComposer();
  initSparks();

  resizeStage();
  applyFx();
  stageLoop();
  return stage;
}

function ensureDie(i){
  var st=stage;if(!st)return null;
  if(st.dies[i])return st.dies[i];
  var mats=[];
  for(var f=0;f<6;f++){
    mats.push(new THREE.MeshPhysicalMaterial({
      color:0xece2c8,roughness:0.38,metalness:0.0,
      clearcoat:0.7,clearcoatRoughness:0.18,
      envMapIntensity:0.90,bumpScale:0.022
    }));
  }
  var mesh=new THREE.Mesh(DIE_GEO,mats);
  mesh.castShadow=true;
  mesh.userData.fresh=true;
  st.scene.add(mesh);
  st.dies[i]=mesh;
  threeCubes[i]=mesh;
  if(!threeAnimating[i])threeAnimating[i]={active:false};
  return mesh;
}

// Point the six faces at the cached textures for this value/held combination.
function setDieFaces(i,value,isHeld){
  var mesh=ensureDie(i);if(!mesh)return;
  var isEmpty=!(value>0);
  var lighting=fxOn('fxLighting');
  for(var f=0;f<6;f++){
    var tex=pipTexture(isEmpty?0:FACE_TO_VALUE[f],isHeld);
    var m=mesh.material[f];
    m.map=tex;m.bumpMap=tex;
    m.transparent=isEmpty;
    m.emissive.setHex(isHeld?0x0c2e1c:0x000000);
    m.emissiveIntensity=isHeld?(lighting?0.32:0.22):0;
    m.needsUpdate=true;
  }
  if(stage)stage.dirty=true;
  if(mesh.userData.fresh&&!isEmpty){
    mesh.quaternion.copy(FACE_QUATS[VALUE_TO_FACE[value]]);
    mesh.userData.fresh=false;
  }
}

// Place each die mesh over its wrapper box. Reading five rects per frame is
// cheap, but only worth doing continuously while something is actually moving.
function syncDieLayout(force){
  var st=stage;if(!st)return;
  var active=st.reordering||rolling;
  if(!active){for(var a=0;a<5;a++)if(threeAnimating[a]&&threeAnimating[a].active){active=true;break;}}
  var now=Date.now();
  if(!force&&!st.needLayout&&!active&&now-st.lastLayout<200)return;
  if(force||st.needLayout)layoutStageCanvas();
  st.lastLayout=now;st.needLayout=false;
  var pr=st.canvas.getBoundingClientRect();
  if(!pr.width||!pr.height)return;
  for(var i=0;i<5;i++){
    var w=diceWraps[i],mesh=st.dies[i];
    if(!mesh)continue;
    if(!w||!w.isConnected){mesh.visible=false;continue;}
    var r=w.getBoundingClientRect();
    if(!r.width||!r.height){mesh.visible=false;continue;}
    mesh.visible=true;
    var cx=r.left+r.width/2-pr.left;
    var cy=r.top+r.height/2-pr.top;
    var nx=(cx-pr.width/2)*st.wpp,ny=(pr.height/2-cy)*st.wpp;
    var box=r.width*st.wpp;
    if(Math.abs(nx-mesh.position.x)>1e-4||Math.abs(ny-mesh.position.y)>1e-4||
       Math.abs(box-(mesh.userData.box||0))>1e-4)st.dirty=true;
    mesh.position.x=nx;mesh.position.y=ny;
    if(mesh.userData.box===undefined)mesh.scale.setScalar(box*DIE_REST);
    mesh.userData.box=box;
  }
}

function stageLoop(){
  var st=stage;if(!st)return;
  st.raf=requestAnimationFrame(stageLoop);
  syncDieLayout(false);
  var moving=false;
  // Animation is driven by elapsed time, not by frame count, so a roll takes
  // the same wall-clock time whether the device is running at 60fps or 20.
  var nowMs=(window.performance&&performance.now)?performance.now():Date.now();
  var dt=Math.min(100,nowMs-(st.lastFrame||nowMs-16.7));
  st.lastFrame=nowMs;
  var step=dt/16.667;                       // frames-equivalent at 60fps
  var ease=function(perFrame){return 1-Math.pow(1-perFrame,step);};
  var t=Date.now()*0.0008;
  for(var i=0;i<5;i++){
    var mesh=st.dies[i];
    if(!mesh||!mesh.visible)continue;
    var anim=threeAnimating[i]||{active:false};
    if(anim.active){
      // Roll: tumble for a beat, then settle onto the target face
      anim.t=(anim.t||0)+0.08*step;
      if(anim.t<1){
        mesh.rotation.x+=(0.18+anim.t*0.1)*step;
        mesh.rotation.y+=(0.22+anim.t*0.08)*step;
        mesh.rotation.z+=0.1*step;
      } else {
        mesh.quaternion.slerp(anim.targetQuat,ease(0.15));
        if(Math.abs(mesh.quaternion.dot(anim.targetQuat))>0.9995){
          mesh.quaternion.copy(anim.targetQuat);
          anim.active=false;
          mesh.userData.sq=1;                       // squash-and-settle
          // Spawn just in front of the die's bottom edge — at the die's own z
          // the sparks would be born inside the cube and never escape it.
          var hw=(mesh.userData.box||0.6)*DIE_REST*0.5;
          emitSparks3D(mesh.position.x,mesh.position.y-hw*0.9,mesh.position.z+hw*1.15,12,hw);
          screenShake(1.5);sfxLand();
          if(anim.onDone)anim.onDone();
        }
      }
    } else {
      // Idle: gentle bob
      mesh.rotation.x+=Math.sin(t+i)*0.001*step;
      mesh.rotation.y+=Math.cos(t*0.7+i)*0.001*step;
    }
    var box=mesh.userData.box;
    if(box!==undefined){
      var want=box*(anim.active?DIE_ROLL:DIE_REST);
      var cur=mesh.userData.baseScale;
      if(cur===undefined)cur=want;
      if(Math.abs(cur-want)>want*0.004){cur=cur+(want-cur)*ease(0.18);moving=true;}
      else cur=want;
      mesh.userData.baseScale=cur;
      var sq=mesh.userData.sq||0;
      if(sq>0.002&&fxOn('fxJuice')){
        sq=Math.max(0,sq-0.055*step);
        mesh.userData.sq=sq;
        // damped wobble: squat on impact, overshoot, settle
        var w=Math.sin(sq*Math.PI*3)*sq*0.24;
        mesh.scale.set(cur*(1+w),cur*(1-w*1.35),cur*(1+w));
        moving=true;
      } else {
        mesh.userData.sq=0;
        mesh.scale.setScalar(cur);
      }
    }
    if(anim.active)moving=true;
  }
  if(updateSparks(step))moving=true;
  if(st.push>0.004){
    st.push*=Math.pow(0.045,dt/1000);
    st.camera.position.z=STAGE_DIST-st.push;
    moving=true;
  } else if(st.push){
    st.push=0;st.camera.position.z=STAGE_DIST;moving=true;
  }
  // Nothing moving and nothing changed? Draw only on a slow tick so the idle
  // bob keeps going without paying for a full-rate redraw of a physical
  // material plus a shadow pass.
  st.frame=(st.frame||0)+1;
  var busy=moving||st.dirty||st.reordering||st.caPulse>0;
  if(!busy&&st.frame%6!==0)return;
  // Discrete changes (hold, new faces, relayout) refresh the shadow map at
  // once; continuous motion only needs it a few times a second.
  if(st.dirty||(busy&&st.frame%3===0))st.renderer.shadowMap.needsUpdate=true;
  st.dirty=false;
  // Decay the aberration pulse
  if(st.caPulse>0){
    st.caPulse=Math.max(0,st.caPulse-0.045*step);
    if(st.ca){
      var o=st.caPeak*st.caPulse*st.caPulse;   // ease out quickly
      st.ca.offset.set(o,o*0.6);
    }
    st.dirty=true;
  }
  if(fxOn('fxPost')&&st.composer)st.composer.render();
  else st.renderer.render(st.scene,st.camera);
}

// The canvas only needs to cover the dice column, not the whole panel — the
// empty space below the dice was costing roughly half the fill rate. Keep a
// margin around it so tumbling corners and shadows aren't clipped.
var STAGE_MARGIN=0.38;   // fraction of one die box
function layoutStageCanvas(){
  var st=stage;if(!st)return;
  var panel=st.panel;
  var prect=panel.getBoundingClientRect();
  var pw=panel.clientWidth,ph=panel.clientHeight;
  if(!pw||!ph)return;
  var top=Infinity,bottom=-Infinity,any=false;
  for(var i=0;i<5;i++){
    var w=diceWraps[i];
    if(!w||!w.isConnected)continue;
    var r=w.getBoundingClientRect();
    if(!r.height)continue;
    any=true;
    if(r.top<top)top=r.top;
    if(r.bottom>bottom)bottom=r.bottom;
  }
  var ctop=0,ch=ph;
  if(any){
    var m=(bottom-top)/5*STAGE_MARGIN;
    ctop=Math.max(0,top-prect.top-m);
    ch=Math.min(ph-ctop,(bottom-top)+m*2);
  }
  if(ch<40)ch=Math.min(ph,40);
  if(st.cw===pw&&st.ch===ch&&st.ctop===ctop)return;
  st.cw=pw;st.ch=ch;st.ctop=ctop;
  st.canvas.style.top=ctop.toFixed(1)+'px';
  st.renderer.setSize(pw,ch);
  st.camera.aspect=pw/ch;
  st.camera.updateProjectionMatrix();
  var visH=2*STAGE_DIST*Math.tan(STAGE_FOV*Math.PI/360);
  st.wpp=visH/ch;                    // world units per CSS pixel at z=0
  var halfW=pw*st.wpp/2,halfH=visH/2;
  st.catcher.scale.set(halfW*2.6,halfH*2.6,1);
  var sc=st.key.shadow.camera;
  sc.left=-halfW*2;sc.right=halfW*2;sc.top=halfH*1.5;sc.bottom=-halfH*1.5;
  sc.updateProjectionMatrix();
  if(st.composer)st.composer.setSize(pw,ch);
  st.dirty=true;
}

function resizeStage(){
  var st=stage;if(!st)return;
  st.cw=st.ch=st.ctop=undefined;     // force a re-fit
  layoutStageCanvas();
  st.needLayout=true;st.dirty=true;
}

// Called by the Effects toggle so the new lighting can be A/B'd against the
// old flat look without reloading.
function applyFx(){
  var st=stage;if(!st)return;
  var on=fxOn('fxLighting');
  st.scene.environment=on?st.env:null;
  st.renderer.toneMapping=on?THREE.ACESFilmicToneMapping:THREE.NoToneMapping;
  st.renderer.shadowMap.enabled=on;
  st.amb.intensity=on?1.05:2.25;
  st.key.intensity=on?2.85:1.90;
  st.key.castShadow=on;
  st.fill.intensity=on?0.80:0.70;
  st.catcher.visible=on;
  st.dirty=true;
  for(var i=0;i<5;i++){
    var mesh=st.dies[i];if(!mesh)continue;
    mesh.castShadow=on;
    for(var f=0;f<6;f++){
      var m=mesh.material[f];
      m.clearcoat=on?0.7:0;
      m.envMapIntensity=on?0.90:0;
      m.bumpScale=on?0.022:0;
      m.roughness=on?0.38:0.85;
      m.needsUpdate=true;
    }
  }
}

function resizeDiceRenderers(){
  resizeStage();
}

// Size the dice to the space that's actually there: measure the row, take off the
// roll controls and padding, split what's left five ways. Also capped by width so
// the dice column can't crowd out the scorecard.
var MAX_SLOT=92;
// Driven by the settings sliders. 100% = as big as the space allows (capped at
// MAX_SLOT), 50% = half that. Gap is extra pixels between die boxes; negative
// overlaps them into the dead space around each cube.
var DIE_SCALE_PCT=100;
var DIE_GAP_PX=0;

function fitDice(){
  var panel=document.getElementById('dice-panel');
  var row=document.querySelector('.main-row');
  if(!panel||!row)return;
  var rowH=row.clientHeight,rowW=row.clientWidth;
  if(!rowH||!rowW)return;
  var ctrl=panel.querySelector('.dice-controls');
  var ctrlH=ctrl?ctrl.getBoundingClientRect().height:74;
  var byHeight=(rowH-ctrlH-4)/5;     // 4 = panel padding
  var byWidth=rowW*0.46-6;           // leave the scorecard at least ~54%
  // MAX_SLOT keeps the column tight: with the camera pulled in, a 92px box shows a
  // bigger die than the old 110px box did, so extra height stays as breathing room
  // rather than pushing the dice apart.
  // The gap eats into the height budget, so account for it before dividing
  var gap=DIE_GAP_PX;
  var budget=Math.min(byHeight-gap*0.8,byWidth,MAX_SLOT);
  var slot=Math.max(30,budget*(DIE_SCALE_PCT/100));
  var root=document.documentElement;
  root.style.setProperty('--slot',slot.toFixed(1)+'px');
  root.style.setProperty('--die',(slot-1).toFixed(1)+'px');
  root.style.setProperty('--slot-squeeze',(gap/2).toFixed(1)+'px');
  requestAnimationFrame(resizeDiceRenderers);
}
window.addEventListener('resize',fitDice);
window.addEventListener('orientationchange',function(){setTimeout(fitDice,150)});

function rollDieTo(origIdx,newValue,onDone){
  var mesh=threeCubes[origIdx];
  if(!mesh)return;
  // Faces are per-value textures, so this just makes sure the die is showing
  // the full (unheld) pip set before it tumbles.
  setDieFaces(origIdx,newValue,false);
  var targetQ=FACE_QUATS[VALUE_TO_FACE[newValue]].clone();
  threeAnimating[origIdx]={active:true,t:0,targetQuat:targetQ,onDone:onDone};
  if(stage)stage.needLayout=true;
}

function updateDieHeld(origIdx,isHeld,value){
  if(!threeCubes[origIdx])return;
  setDieFaces(origIdx,value,isHeld);
}

// ── State ────────────────────────────────────────────────────
var MAX_ROLLS,UPPER_TARGET,UPPER_BONUS;
var dice,held,rollCount,scores,rolling;
var showBoth=true;
var diceRight=false;
var yahtzeeBonus=0;
var yahtzeeCount=0; // Yahtzees scored this game — drives celebration size (1=single, 2=double, 3+=triple)
var chartBin=20; // histogram bucket size in points
var gameOver=false;

// ── Dice ordering ─────────────────────────────────────────────
// Display order is frozen at roll time so nothing snaps around after the dice land.
var slotOrder=null;

// Order used from the moment Roll is pressed: held dice keep their sorted grouping at
// the top, everything being rerolled drops to the bottom to tumble together.
function rollSlotOrder(){
  var o=orderedDiceSlots();
  var h=[],f=[],seen={};
  for(var s=0;s<5;s++){
    var oi=o.origIdx[s];
    if(oi===undefined||oi<0||seen[oi])continue;
    seen[oi]=true;
    (held[oi]?h:f).push(oi);
  }
  for(var i=0;i<5;i++)if(!seen[i])(held[i]?h:f).push(i);
  return h.concat(f);
}

// Slots to draw right now: the frozen roll order if there is one, else the natural sort.
function currentSlots(){
  if(slotOrder&&slotOrder.length===5){
    return{
      slots:slotOrder.map(function(i){return dice[i]}),
      heldSlots:slotOrder.map(function(i){return !!held[i]}),
      origIdx:slotOrder.slice()
    };
  }
  return orderedDiceSlots();
}

function detectIntent(){
  var hv=[];for(var i=0;i<5;i++)if(held[i])hv.push(dice[i]);
  if(!hv.length)return'none';
  var u=[];hv.forEach(function(v){if(u.indexOf(v)<0)u.push(v)});u.sort(function(a,b){return a-b});
  var maxRun=1,run=1;
  for(var i=1;i<u.length;i++){if(u[i]===u[i-1]+1)run++;else run=1;if(run>maxRun)maxRun=run}
  if(u.length===hv.length&&maxRun>=2)return'straight';
  var vk=Object.keys(cm(hv));
  if(vk.length===1)return'upper';
  if(vk.length===2)return'pairs';
  return'upper';
}

function orderedDiceSlots(){
  var hv=[],fv=[],hoi=[],foi=[];
  for(var i=0;i<5;i++){if(held[i]){hv.push(dice[i]);hoi.push(i)}else{fv.push(dice[i]);foi.push(i)}}
  if(!hv.length)return{slots:dice.slice(),heldSlots:[false,false,false,false,false],origIdx:[0,1,2,3,4]};
  var intent=detectIntent();
  var slots=[0,0,0,0,0],hs=[false,false,false,false,false],oi=[-1,-1,-1,-1,-1];

  if(intent==='straight'){
    var hset={};hv.forEach(function(v){hset[v]=true});
    var ranges=[[1,2,3,4,5],[2,3,4,5,6],[1,2,3,4],[2,3,4,5],[3,4,5,6]];
    function cntIn(r){var n=0;r.forEach(function(v){if(hset[v])n++});return n}
    var best=ranges[0],bestN=cntIn(ranges[0]);
    for(var ri=1;ri<ranges.length;ri++){var cn=cntIn(ranges[ri]);if(cn>bestN){bestN=cn;best=ranges[ri]}}
    while(best.length<5)best.push(0);
    var hp=[];for(var i=0;i<5;i++)if(held[i])hp.push({v:dice[i],oi:i});
    var fp=fv.slice(),fp_oi=foi.slice(),fpPtr=0;
    for(var s=0;s<5;s++){
      var t=best[s];
      if(t===0){if(fpPtr<fp.length){slots[s]=fp[fpPtr];hs[s]=false;oi[s]=fp_oi[fpPtr];fpPtr++}continue}
      var fi=-1;for(var h=0;h<hp.length;h++)if(hp[h].v===t){fi=h;break}
      if(fi>=0){slots[s]=t;hs[s]=true;oi[s]=hp[fi].oi;hp.splice(fi,1)}
    }
    for(var s=0;s<5;s++)if(oi[s]===-1&&fpPtr<fp.length){slots[s]=fp[fpPtr];hs[s]=false;oi[s]=fp_oi[fpPtr];fpPtr++}
    return{slots:slots,heldSlots:hs,origIdx:oi};
  }

  if(intent==='pairs'){
    var c2=cm(hv),grp=Object.keys(c2).map(function(v){return{v:+v,n:c2[v]}}).sort(function(a,b){return b.n-a.n}),pos=0;
    for(var g=0;g<grp.length;g++){var gv=grp[g].v;for(var i=0;i<5;i++)if(held[i]&&dice[i]===gv&&pos<5){slots[pos]=dice[i];hs[pos]=true;oi[pos]=i;pos++}}
    for(var i=0;i<fv.length;i++)if(pos<5){slots[pos]=fv[i];hs[pos]=false;oi[pos]=foi[i];pos++}
    return{slots:slots,heldSlots:hs,origIdx:oi};
  }

  // default: held top
  var pos=0;
  for(var i=0;i<5;i++)if(held[i]){slots[pos]=dice[i];hs[pos]=true;oi[pos]=i;pos++}
  for(var i=0;i<fv.length;i++){slots[pos]=fv[i];hs[pos]=false;oi[pos]=foi[i];pos++}
  return{slots:slots,heldSlots:hs,origIdx:oi};
}

// ── Probability engine ────────────────────────────────────────
// Core idea:
//   YELLOW bar = held-aware odds: dice[i] where held[i]=true are LOCKED, only free dice roll
//   GREEN bar  = held-blind odds: ALL dice are treated as free (ignore held state)
//
// Upper section: goal = get to 3+ of targetNum
//   held-aware: count already-held matching dice, simulate rolling free dice
//   held-blind: ignore held, simulate all 5 dice freely
//
// Lower section: goal = category scores > 0 (chance: sum >= 17)
//   held-aware: locked dice stay, simulate free dice with smart-hold between rolls
//   held-blind: all 5 dice free each simulation, smart-hold between rolls
//
// rollsLeft = MAX_ROLLS - rollCount (remaining rolls to use)

var SIM=5000;

// ── Upper: held-aware ──
function pUpperHeld(num,rl){
  // count locked matching dice
  var locked=0;for(var i=0;i<5;i++)if(held[i]&&dice[i]===num)locked++;
  if(locked>=3)return 1;
  if(rl===0){
    // no more rolls — score is what it is right now
    var cur=0;for(var i=0;i<5;i++)if(dice[i]===num)cur++;return cur>=3?1:0;
  }
  var freeCount=0;for(var i=0;i<5;i++)if(!held[i])freeCount++;
  var hits=0;
  for(var r=0;r<SIM;r++){
    var matched=locked,free=freeCount;
    for(var roll=0;roll<rl;roll++){
      // roll free dice, keep ones that match
      var nm=0;for(var d=0;d<free;d++)if(rnd()===num)nm++;
      matched+=nm;
      if(matched>=3){hits++;break}
      free=5-matched; // hold all matched going forward
    }
  }
  return hits/SIM;
}

// ── Upper: held-blind ──
// Start from current dice values; ignore held state; optimally hold matching dice between rolls.
// Green bar = "given what's showing, best odds if I rerolled freely"
function pUpperFree(num,rl){
  var startMatch=0;for(var i=0;i<5;i++)if(dice[i]===num)startMatch++;
  if(startMatch>=3)return 1;
  if(rl===0)return 0;
  var startFree=5-startMatch; // non-matching dice we can reroll
  var hits=0;
  for(var r=0;r<SIM;r++){
    var matched=startMatch,free=startFree;
    for(var roll=0;roll<rl;roll++){
      var nm=0;for(var d=0;d<free;d++)if(rnd()===num)nm++;
      matched+=nm;
      if(matched>=3){hits++;break}
      free=5-matched; // hold all matched, reroll rest
    }
  }
  return hits/SIM;
}

// ── Lower: held-aware ──
// For Yahtzee: base on the best single face value among held dice (or all dice if none held).
// For large straight: use lsHoldMask logic applied to current held selection.
// For others: locked dice stay, smart-hold on free dice between rolls.
function pLowerHeld(catId,rl){
  var cat=findCat(catId);
  var goal=(catId==='ch')?function(d){return sA(d)>=17}:function(d){return cat.fn(d)>0};
  if(goal(dice))return 1;
  if(rl===0)return 0;

  if(catId==='yh'){
    // Find best value among held dice; if nothing held, use best of all dice
    var heldVals=[];for(var i=0;i<5;i++)if(held[i])heldVals.push(dice[i]);
    var pool=heldVals.length?heldVals:dice.slice();
    var pc=cm(pool),best=0,bestVal=pool[0];
    Object.keys(pc).forEach(function(v){if(pc[v]>best){best=pc[v];bestVal=+v;}});
    // locked = count of bestVal already held
    var locked=0;for(var i=0;i<5;i++)if(held[i]&&dice[i]===bestVal)locked++;
    if(locked>=5)return 1;
    var freeCount=5-locked;// we can reroll everything except locked matching dice
    // actually only non-held dice are free
    var freeSlots=0;for(var i=0;i<5;i++)if(!held[i])freeSlots++;
    var hits=0;
    for(var r=0;r<SIM;r++){
      var matched=locked,free=freeSlots;
      for(var roll=0;roll<rl;roll++){
        var nm=0;for(var d2=0;d2<free;d2++)if(rnd()===bestVal)nm++;
        matched+=nm;if(matched>=5){hits++;break}
        free=5-matched;
      }
    }
    return hits/SIM;
  }

  var hits=0;
  for(var r=0;r<SIM;r++){
    var cur=dice.slice(),hm=held.slice();
    for(var roll=0;roll<rl;roll++){
      for(var i=0;i<5;i++)if(!hm[i])cur[i]=rnd();
      if(goal(cur)){hits++;break}
      if(roll<rl-1){
        var sh=smartHold(cur,catId);
        for(var i=0;i<5;i++)if(!hm[i])hm[i]=sh[i];
      }
    }
  }
  return hits/SIM;
}

// ── Lower: held-blind ──
// Start from current dice; treat all as rerollable; smart-hold optimally between rolls.
// For Yahtzee: use best single face value from current dice as the target throughout.
// Green bar = "given what's showing, best odds if I rerolled freely"
function pLowerFree(catId,rl){
  var cat=findCat(catId);
  var goal=(catId==='ch')?function(d){return sA(d)>=17}:function(d){return cat.fn(d)>0};
  if(goal(dice))return 1;
  if(rl===0)return 0;

  if(catId==='yh'){
    // Lock in best value from current dice, simulate rolling remaining dice
    var pc=cm(dice),best=0,bestVal=dice[0];
    Object.keys(pc).forEach(function(v){if(pc[v]>best){best=pc[v];bestVal=+v;}});
    var startMatch=best; // number of current dice showing bestVal
    if(startMatch>=5)return 1;
    var hits=0;
    for(var r=0;r<SIM;r++){
      var matched=startMatch,free=5-startMatch;
      for(var roll=0;roll<rl;roll++){
        var nm=0;for(var d2=0;d2<free;d2++)if(rnd()===bestVal)nm++;
        matched+=nm;if(matched>=5){hits++;break}
        free=5-matched;
      }
    }
    return hits/SIM;
  }

  var hits=0;
  for(var r=0;r<SIM;r++){
    var cur=dice.slice();
    var hm=smartHold(cur,catId);
    for(var i=0;i<5;i++)if(!hm[i])cur[i]=rnd();
    if(goal(cur)){hits++;continue}
    for(var roll=1;roll<rl;roll++){
      hm=smartHold(cur,catId);
      for(var i=0;i<5;i++)if(!hm[i])cur[i]=rnd();
      if(goal(cur)){hits++;break}
    }
  }
  return hits/SIM;
}

function findCat(id){
  for(var i=0;i<LOWER_CATS.length;i++)if(LOWER_CATS[i].id===id)return LOWER_CATS[i];
  return null;
}

// ── Large straight hold strategy ──────────────────────────────
// Spine: 2,3,4,5. Keep all spine values.
// Cap values: 1 and 6. Choose the cap that completes the best range.
// If we have both 1 and 6: pick the range with more spine coverage.
// Range A: 1-2-3-4-5. Range B: 2-3-4-5-6.
function lsHoldMask(d){
  var spine=[2,3,4,5];
  var hasOne=d.indexOf(1)>=0,hasSix=d.indexOf(6)>=0;
  var spineA=0,spineB=0;
  d.forEach(function(v){if(spine.indexOf(v)>=0){spineA++;spineB++;}});
  // Decide which cap to use
  var useOne,useSix;
  if(hasOne&&hasSix){
    // both available: pick range with same or better coverage (both have same spine)
    // prefer range A (1-2-3-4-5) arbitrarily if tied — doesn't matter much
    useOne=true;useSix=false;
  } else {
    useOne=hasOne;useSix=hasSix;
  }
  // Build keep set
  var keepVals=[2,3,4,5];
  if(useOne)keepVals.push(1);
  if(useSix)keepVals.push(6);
  // Mark which dice to hold (each unique value kept once — avoid dupes)
  var used={};
  return d.map(function(v){
    if(keepVals.indexOf(v)>=0&&!used[v]){used[v]=true;return true}
    return false;
  });
}

// ── Yahtzee hold strategy ──────────────────────────────────────
// Hold all dice matching the face value with the highest current count.
function yhHoldMask(d){
  var c=cm(d);
  var best=0,bestVal=d[0];
  Object.keys(c).forEach(function(v){if(c[v]>best){best=c[v];bestVal=+v;}});
  return d.map(function(v){return v===bestVal});
}

function smartHold(d,catId){
  var c=cm(d),sv=Object.keys(c).map(function(v){return{v:+v,n:c[v]}}).sort(function(a,b){return b.n-a.n});
  if(catId==='yh') return yhHoldMask(d);
  if(catId==='3k'||catId==='4k'){var t=sv[0].v;return d.map(function(v){return v===t})}
  if(catId==='fh'){
    if(sv.length>=2){var k=[sv[0].v,sv[1].v];return d.map(function(v){return k.indexOf(v)>=0})}
    return d.map(function(){return false});
  }
  if(catId==='ls') return lsHoldMask(d);
  if(catId==='ss'){
    var u=[];d.forEach(function(v){if(u.indexOf(v)<0)u.push(v)});u.sort(function(a,b){return a-b});
    var best=[u[0]],run=[u[0]];
    for(var i=1;i<u.length;i++){if(u[i]===u[i-1]+1)run.push(u[i]);else run=[u[i]];if(run.length>best.length)best=run.slice()}
    return d.map(function(v){return best.indexOf(v)>=0});
  }
  if(catId==='ch'){
    var sorted=d.slice().sort(function(a,b){return b-a});
    var threshold=sorted[2];
    var kept=0;return d.map(function(v){if(v>=threshold&&kept<3){kept++;return true}return false});
  }
  return d.map(function(){return false});
}

// ── Row background builder ─────────────────────────────────────
// Used rows: gray bar = actual score / (3 * targetNum) for upper, or max-based for lower
// Unrolled: flat surface
// Rolled: green bar = free odds width, yellow bar = held odds width (overlaid)

var COL_SURFACE='#16213e';
var COL_SURFACE_END='#12193a';
var COL_GRAY_BAR='rgba(110,110,130,.6)';
var COL_GRAY_FADE='rgba(60,60,75,.3)';
var COL_GREEN='rgba(35,130,70,.62)';
var COL_YELLOW='rgba(190,150,15,.72)';

function rowBg(isUsed,isUpper,targetNum,catId,rl){
  if(isUsed){
    // Gray bar: actual score / target
    var actual=scores[isUpper?catId:catId]||0;
    if(isUpper){
      // target = 3 * face value
      var target=targetNum*3;
      var pct=clamp01(actual/target)*100;
      if(pct<=0)return COL_SURFACE;
      var gEnd2=(Math.min(pct+6,100)).toFixed(1);
      return 'linear-gradient(to right,'+COL_GRAY_BAR+' '+pct.toFixed(1)+'%,'+COL_GRAY_FADE+' '+gEnd2+'%)';
    } else {
      // lower section max values
      var maxVal={
        '3k':30,'4k':30,'fh':25,'ss':30,'ls':40,'yh':50,'ch':30
      }[catId]||30;
      var pct=clamp01(actual/maxVal)*100;
      if(pct<=0)return COL_SURFACE;
      var gEnd2=(Math.min(pct+6,100)).toFixed(1);
      return 'linear-gradient(to right,'+COL_GRAY_BAR+' '+pct.toFixed(1)+'%,'+COL_GRAY_FADE+' '+gEnd2+'%)';
    }
  }

  if(rollCount===0)return COL_SURFACE;

  var pH,pF;
  if(isUpper){
    pH=pUpperHeld(targetNum,rl);
    pF=pUpperFree(targetNum,rl);
  } else {
    pH=pLowerHeld(catId,rl);
    pF=pLowerFree(catId,rl);
  }

  var yPct=clamp01(pH)*100;
  var gPct=clamp01(pF)*100;

  // green is always >= yellow (free >= held in general, but clamp to be safe)
  // Layer stack (painter's algorithm — last listed = furthest back):
  // 1. yellow from 0..yPct
  // 2. green from 0..gPct  (will show where yellow doesn't cover)
  // 3. surface base
  // Gradient bars: each color fades from a richer tone to a lighter one at the edge
  // Yellow (held) on top, green (free) behind, surface base
  return (
    'linear-gradient(to right,'+COL_YELLOW+' '+yPct.toFixed(1)+'%,transparent '+yPct.toFixed(1)+'%),'
    +'linear-gradient(to right,'+COL_GREEN+' '+gPct.toFixed(1)+'%,transparent '+gPct.toFixed(1)+'%),'
    +COL_SURFACE
  );
}

}

function newGame(){
  dice=[0,0,0,0,0];held=[false,false,false,false,false];slotOrder=null;
  rollCount=0;scores={};rolling=false;yahtzeeBonus=0;yahtzeeCount=0;gameOver=false;
  document.getElementById('overlay').classList.remove('show');
  render();
}

function swapSides(){

// Slide the dice into their sorted slots BEFORE the roll animation starts.
// FLIP: measure, reparent into the new order, then animate from the old offsets to zero.
var REORDER_MS=420;
function animateReorder(order,done){
  var panel=document.getElementById('dice-panel');
  var slots=Array.prototype.slice.call(panel.querySelectorAll('.die-slot'));
  if(slots.length<5){done();return;}

  // FIRST: where each die is now
  var first={},anyWrap=false;
  for(var i=0;i<5;i++){
    var w0=diceWraps[i];
    if(w0&&w0.isConnected){first[i]=w0.getBoundingClientRect().top;anyWrap=true;}
  }
  if(!anyWrap){done();return;}

  // Does anything actually move?
  var changed=false;
  for(var s=0;s<5;s++){
    if(slots[s].firstElementChild!==diceWraps[order[s]]){changed=true;break;}
  }
  if(!changed){done();return;}

  // Reparent: detach all first so slots never briefly hold two dice
  for(var i=0;i<5;i++){
    var w1=diceWraps[i];
    if(w1&&w1.parentNode)w1.parentNode.removeChild(w1);
  }
  for(var s=0;s<5;s++){
    var w2=diceWraps[order[s]];
    if(w2)slots[s].appendChild(w2);
  }

  // LAST + INVERT: offset each die back to where it was
  var moving=[];
  for(var i=0;i<5;i++){
    var w3=diceWraps[i];
    if(!w3||first[i]===undefined)continue;
    var dy=first[i]-w3.getBoundingClientRect().top;
    w3.style.transition='none';
    w3.style.transform=dy?'translateY('+dy.toFixed(1)+'px)':'';
    if(dy)w3.style.zIndex='4';
    moving.push(w3);
  }

  // PLAY: release them into place with a little overshoot. The 3D dice track
  // the wrappers' bounding boxes, so they ride this transition automatically —
  // the flag just tells the stage to re-read layout every frame while it runs.
  if(stage)stage.reordering=true;
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      moving.forEach(function(w){
        w.style.transition='transform '+REORDER_MS+'ms cubic-bezier(.34,1.32,.5,1)';
        w.style.transform='translateY(0)';
      });
    });
  });
  setTimeout(function(){
    moving.forEach(function(w){w.style.transition='';w.style.transform='';w.style.zIndex='';});
    if(stage){stage.reordering=false;stage.needLayout=true;}
    done();
  },REORDER_MS+40);
}

function rollDice(){
  if(gameOver){
    dice=[0,0,0,0,0];held=[false,false,false,false,false];slotOrder=null;
    rollCount=0;scores={};rolling=false;yahtzeeBonus=0;yahtzeeCount=0;gameOver=false;
    // Reset the dice for a new game. The meshes and the renderer are kept —
    // only the per-die animation state and the DOM wrappers are rebuilt.
    for(var ri=0;ri<5;ri++){
      threeAnimating[ri]={active:false};
      if(stage&&stage.dies[ri]){
        stage.dies[ri].quaternion.identity();
        stage.dies[ri].userData.fresh=true;
      }
      delete diceWraps[ri];
    }
    if(stage)stage.needLayout=true;
    document.getElementById('overlay').classList.remove('show');
    render();return;
  }
  if(rollCount>=MAX_ROLLS||rolling)return;
  rolling=true;
  unlockAudio();sfxRoll();
  // Roll new values first
  var newDice=dice.slice();
  for(var i=0;i<5;i++)if(!held[i])newDice[i]=rnd();
  var doneCount=0,freeCount=0;
  for(var i=0;i<5;i++)if(!held[i])freeCount++;
  if(freeCount===0){rolling=false;return;}
  // Freeze the layout, slide dice into it (rerolls drop to the bottom), THEN spin
  slotOrder=rollSlotOrder();
  animateReorder(slotOrder,function(){
    for(var i=0;i<5;i++){
      if(!held[i]){
        (function(idx,val){
          rollDieTo(idx,val,function(){
            doneCount++;
            if(doneCount>=freeCount){
              dice=newDice.slice();
              rollCount++;rolling=false;
              render();
            }
          });
        })(i,newDice[i]);
      }
    }
  });
}

function toggleHold(origIdx){
  if(rollCount===0||rollCount>=MAX_ROLLS)return;
  held[origIdx]=!held[origIdx];
  screenShake(1.8);sfxHold();
  updateDieHeld(origIdx,held[origIdx],dice[origIdx]);
  // Update held ring
  var w=diceWraps[origIdx];
  if(w){
    var ring=w.querySelector('.held-ring');
    if(held[origIdx]&&!ring){var r2=document.createElement('div');r2.className='held-ring';w.appendChild(r2);}
    else if(!held[origIdx]&&ring)ring.remove();
  }
  renderScorecard();
}

function isYahtzee(d){
  if(!d[0])return false;
  for(var i=1;i<5;i++)if(d[i]!==d[0])return false;
  return true;
}

// ── Joker rules ──────────────────────────────────────────────
// Returns an object describing the current joker situation:
//   {active, faceValue, jokerPriority}
// jokerPriority: 'upper' | 'lower' | 'any'
//   'upper' = must score in matching upper box (it's open)
//   'lower' = matching upper is taken; must score in a lower box if any open
//   'any'   = all lower boxes taken; score anywhere
function jokerState(){
  if(!isYahtzee(dice)||scores['yh']!==50)return{active:false};
  var fv=dice[0]; // face value of the yahtzee
  // upper cat index: fv=1->ones, fv=2->twos, etc.
  var upperCatId=UPPER_CATS[fv-1].id;
  if(scores[upperCatId]===undefined){
    // matching upper box is open — must go there
    return{active:true,faceValue:fv,jokerPriority:'upper',upperCatId:upperCatId};
  }
  // matching upper box is taken — can we score in lower?
  var anyLowerOpen=LOWER_CATS.some(function(cat){return scores[cat.id]===undefined});
  if(anyLowerOpen){
    return{active:true,faceValue:fv,jokerPriority:'lower',upperCatId:upperCatId};
  }
  // all lower boxes taken — score anywhere open
  return{active:true,faceValue:fv,jokerPriority:'any',upperCatId:upperCatId};
}

// Returns true if a given category id is a legal scoring choice right now
function isLegalScore(catId,isUpper){
  if(scores[catId]!==undefined)return false; // already used
  var js=jokerState();
  if(!js.active)return true; // normal turn, anything open is fine
  if(js.jokerPriority==='upper'){
    // ONLY the matching upper box is legal
    return(isUpper&&catId===js.upperCatId);
  }
  if(js.jokerPriority==='lower'){
    // only lower section boxes are legal
    return(!isUpper);
  }
  // 'any' — anything open
  return true;
}

function claimScore(id,val){
  if(scores[id]!==undefined||rollCount===0)return;
  // enforce joker legality
  var isUpper=UPPER_CATS.some(function(cat){return cat.id===id});
  if(!isLegalScore(id,isUpper))return;
  var gotYahtzee=isYahtzee(dice);
  // award +100 bonus for extra Yahtzee
  var extraYahtzee=false;
  if(gotYahtzee&&scores['yh']===50){
    yahtzeeBonus+=100;
    extraYahtzee=true;
  }
  // Grab the row's position before the scorecard is rebuilt under us, so the
  // burst and the floating total land on the box that was just filled.
  var rowEl=document.querySelector('.score-row[data-cat="'+id+'"]');
  var rect=rowEl?rowEl.getBoundingClientRect():null;
  var upBefore=UPPER_CATS.reduce(function(a,c){return a+(scores[c.id]||0)},0);

  scores[id]=val;
  held=[false,false,false,false,false];rollCount=0;dice=[0,0,0,0,0];slotOrder=null;
  render();

  // Scoring juice: a burst out of the filled row, the points floating up, and
  // a kick that scales with how good the box was.
  if(rect&&rect.width){
    var px=rect.left+rect.width*0.62,py=rect.top+rect.height/2;
    sfxScore();
    bgPulse(val>0?Math.min(1,0.45+val/90):0.25);
    yzBurst(px,py,0.7,val>0?16:6,val>0?5:2);
    popScore((val>0?'+':'')+val,px,py-4,val>0?'#f5a623':'#7a8499',val>=30?27:22);
    screenShake(val>0?2.4+Math.min(val,50)/12:1.2);
    if(extraYahtzee){
      setTimeout(function(){popScore('+100 BONUS',px,py-30,'#ff6a4d',20)},260);
    }
    var upAfter=UPPER_CATS.reduce(function(a,c){return a+(scores[c.id]||0)},0);
    if(upBefore<UPPER_TARGET&&upAfter>=UPPER_TARGET){
      setTimeout(function(){
        popScore('UPPER BONUS +'+UPPER_BONUS,window.innerWidth/2,py-46,'#74c69d',22);
        yzBurst(window.innerWidth/2,py-46,0.8,22,6);
        screenShake(6);
      },340);
    }
  }
  if(gotYahtzee){
    yahtzeeCount++;
    celebrateYahtzee(yahtzeeCount);
  }
  var all=UPPER_CATS.concat(LOWER_CATS);
  if(all.every(function(c){return scores[c.id]!==undefined})){
    setTimeout(function(){
      gameOver=true;
      var total=calcTotal();saveScore(total);
      document.getElementById('final-score').textContent=total;
      document.getElementById('ov-rank').textContent=getRankText(total);
      document.getElementById('overlay').classList.add('show');
    },300);
  }
}

function calcTotal(){
  var up=UPPER_CATS.reduce(function(a,c){return a+(scores[c.id]||0)},0);
  return up+(up>=UPPER_TARGET?UPPER_BONUS:0)+LOWER_CATS.reduce(function(a,c){return a+(scores[c.id]||0)},0)+yahtzeeBonus;
}

// ── Sound ────────────────────────────────────────────────────────────────────
// Everything is synthesised, so the app stays one file with no audio assets.
// iOS will not start an AudioContext outside a user gesture, so the context is
// created on the first tap and nothing is scheduled before that.
var AC=null,audioMaster=null,audioReady=false;
var musicTimer=null,musicStep=0;

function unlockAudio(){
  if(audioReady)return;
  var Ctor=window.AudioContext||window.webkitAudioContext;
  if(!Ctor)return;
  try{
    AC=new Ctor();
    audioMaster=AC.createGain();
    audioMaster.gain.value=0.9;
    audioMaster.connect(AC.destination);
    if(AC.state==='suspended')AC.resume();
    audioReady=true;
    if(fxOn('fxMusic'))startMusic();
  }catch(e){audioReady=false;}
}

function sfxReady(){return audioReady&&AC&&fxOn('fxSound');}
function rnd2(a,b){return a+Math.random()*(b-a);}

// Short burst of filtered noise — the body of every impact sound.
function noiseBurst(dur,freq,q,gain,type){
  if(!sfxReady())return;
  var n=Math.max(1,Math.floor(AC.sampleRate*dur));
  var buf=AC.createBuffer(1,n,AC.sampleRate);
  var d=buf.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var src=AC.createBufferSource();src.buffer=buf;
  var flt=AC.createBiquadFilter();
  flt.type=type||'bandpass';flt.frequency.value=freq;flt.Q.value=q;
  var g=AC.createGain();
  g.gain.setValueAtTime(gain,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  src.connect(flt);flt.connect(g);g.connect(audioMaster);
  src.start();src.stop(AC.currentTime+dur+0.02);
}

// Struck metal: a quick pitched ping with a fast decay.
function ping(freq,dur,gain,type){
  if(!sfxReady())return;
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'triangle';
  o.frequency.setValueAtTime(freq,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*0.7),AC.currentTime+dur);
  g.gain.setValueAtTime(gain,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  o.connect(g);g.connect(audioMaster);
  o.start();o.stop(AC.currentTime+dur+0.02);
}

// Every effect takes a little random pitch so repeats don't sound cloned.
function sfxRoll(){   noiseBurst(0.26,rnd2(900,1300),1.1,0.16,'bandpass'); }
function sfxHold(){   ping(rnd2(680,820),0.10,0.10); noiseBurst(0.05,2600,2.0,0.05); }
function sfxLand(){   noiseBurst(0.09,rnd2(260,420),1.6,0.17); ping(rnd2(150,200),0.07,0.06,'sine'); }
function sfxScore(){  noiseBurst(0.16,rnd2(380,520),1.2,0.18); ping(rnd2(300,360),0.16,0.09); }
function sfxYahtzee(tier){
  if(!sfxReady())return;
  // forge hammer: deep hit, then a bright metallic ring
  ping(rnd2(70,90),0.5,0.26,'sine');
  noiseBurst(0.3,rnd2(220,300),0.8,0.22,'lowpass');
  var base=rnd2(520,600);
  for(var i=0;i<2+Math.min(tier,3);i++){
    (function(k){setTimeout(function(){ping(base*(1+k*0.5),0.34,0.08);},70+k*85);})(i);
  }
}

// ── Background music ─────────────────────────────────────────────────────────
// A sparse industrial pulse. Tempo climbs as the scorecard fills.
var MUSIC_NOTES=[110.00,130.81,146.83,164.81,196.00,164.81,146.83,130.81];
function musicTempoMs(){
  var filled=UPPER_CATS.concat(LOWER_CATS).filter(function(c){return scores&&scores[c.id]!==undefined}).length;
  var level=Math.min(1,filled/13);
  return 620-level*260;                     // ~97bpm climbing to ~165bpm
}
function startMusic(){
  if(!audioReady||musicTimer||!fxOn('fxMusic'))return;
  var tick=function(){
    if(!fxOn('fxMusic')||!audioReady){stopMusic();return;}
    var i=musicStep%8;
    if(i===0||i===4){                        // kick
      var o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(96,AC.currentTime);
      o.frequency.exponentialRampToValueAtTime(42,AC.currentTime+0.16);
      g.gain.setValueAtTime(0.16,AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.2);
      o.connect(g);g.connect(audioMaster);o.start();o.stop(AC.currentTime+0.22);
    }
    if(i%2===1){                             // off-beat metallic tick
      var o2=AC.createOscillator(),g2=AC.createGain();
      o2.type='triangle';
      o2.frequency.value=MUSIC_NOTES[i]*2;
      g2.gain.setValueAtTime(0.030,AC.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.13);
      o2.connect(g2);g2.connect(audioMaster);o2.start();o2.stop(AC.currentTime+0.15);
    }
    var o3=AC.createOscillator(),g3=AC.createGain();   // bass line
    o3.type='sawtooth';
    o3.frequency.value=MUSIC_NOTES[i]/2;
    var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;
    g3.gain.setValueAtTime(0.045,AC.currentTime);
    g3.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.3);
    o3.connect(lp);lp.connect(g3);g3.connect(audioMaster);
    o3.start();o3.stop(AC.currentTime+0.32);
    musicStep++;
    musicTimer=setTimeout(tick,musicTempoMs());
  };
  musicTimer=setTimeout(tick,10);
}
function stopMusic(){
  if(musicTimer){clearTimeout(musicTimer);musicTimer=null;}
}

// ── Shader backdrop ──────────────────────────────────────────────────────────
// A slow industrial grid on its own small WebGL context — raw GL rather than a
// second three.js renderer, since it is one fullscreen triangle and no scene
// graph. Rendered at reduced resolution because it is all low-frequency.
var BG_SCALE=0.55;          // backing store relative to CSS pixels
var bg=null;

var BG_VERT='attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}';
var BG_FRAG=[
'precision mediump float;',
'uniform vec2 uRes;uniform float uTime,uPulse,uLevel;',
'float hash(vec2 v){return fract(sin(dot(v,vec2(12.9898,78.233)))*43758.5453);}',
'void main(){',
'  vec2 uv=gl_FragCoord.xy/uRes;',
'  vec2 p=uv*2.0-1.0;p.x*=uRes.x/uRes.y;',
'  float r=length(p);',
// slow drifting machine-shop grid, denser toward the floor
'  vec2 g=vec2(p.x*3.4,p.y*3.4+uTime*0.05);',
'  vec2 gf=abs(fract(g)-0.5);',
'  float line=smoothstep(0.035,0.0,min(gf.x,gf.y));',
'  vec2 g2=g*0.25;vec2 gf2=abs(fract(g2)-0.5);',
'  float major=smoothstep(0.012,0.0,min(gf2.x,gf2.y));',
// palette drifts from cold steel toward warm forge as the card fills
'  vec3 cold=vec3(0.07,0.10,0.19);',
'  vec3 warm=vec3(0.16,0.10,0.09);',
'  vec3 base=mix(cold,warm,clamp(uLevel,0.0,1.0));',
'  vec3 lineCol=mix(vec3(0.30,0.46,0.72),vec3(0.86,0.55,0.18),clamp(uLevel,0.0,1.0));',
// a slow bright band sweeping down, like a shop light passing
'  float band=smoothstep(0.35,0.0,abs(fract(uv.y*0.5-uTime*0.015)-0.5));',
'  vec3 col=base+lineCol*(line*0.16+major*0.26)*(0.45+band*0.75);',
// pulse: a ring pushing out from the middle on a scoring hit
'  float ring=smoothstep(0.26,0.0,abs(r-(1.0-uPulse)*1.5));',
'  col+=lineCol*ring*uPulse*0.5;',
'  col+=lineCol*uPulse*0.06;',
'  col*=1.0-0.40*smoothstep(0.55,1.65,r);',          // vignette
'  col+=(hash(gl_FragCoord.xy+uTime)-0.5)*0.016;',   // grain breaks up banding
'  gl_FragColor=vec4(col,1.0);',
'}'].join('\n');

function initBackdrop(){
  if(bg)return bg;
  var cv=document.getElementById('bg-stage');
  if(!cv)return null;
  var gl=cv.getContext('webgl',{antialias:false,alpha:false,depth:false,stencil:false})||
         cv.getContext('experimental-webgl');
  if(!gl)return null;
  function compile(type,src){
    var sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))return null;
    return sh;
  }
  var vs=compile(gl.VERTEX_SHADER,BG_VERT),fs=compile(gl.FRAGMENT_SHADER,BG_FRAG);
  if(!vs||!fs)return null;
  var prog=gl.createProgram();
  gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS))return null;
  gl.useProgram(prog);
  var buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  bg={gl:gl,cv:cv,prog:prog,t0:Date.now(),pulse:0,level:0,raf:null,frame:0,
      uRes:gl.getUniformLocation(prog,'uRes'),
      uTime:gl.getUniformLocation(prog,'uTime'),
      uPulse:gl.getUniformLocation(prog,'uPulse'),
      uLevel:gl.getUniformLocation(prog,'uLevel')};
  resizeBackdrop();
  window.addEventListener('resize',resizeBackdrop);
  backdropLoop();
  return bg;
}

function resizeBackdrop(){
  if(!bg)return;
  var w=Math.max(1,Math.round(window.innerWidth*BG_SCALE));
  var h=Math.max(1,Math.round(window.innerHeight*BG_SCALE));
  if(bg.cv.width===w&&bg.cv.height===h)return;
  bg.cv.width=w;bg.cv.height=h;
  bg.gl.viewport(0,0,w,h);
}

// Ripple the backdrop on a scoring hit.
function bgPulse(amount){ if(bg)bg.pulse=Math.max(bg.pulse,amount); }
// 0..1, drives the palette drift as the scorecard fills.
function bgSetLevel(v){ if(bg)bg.level=v; }

function backdropLoop(){
  if(!bg)return;
  bg.raf=requestAnimationFrame(backdropLoop);
  if(!fxOn('fxBackground')){
    if(!bg.cleared){
      bg.gl.clearColor(0.102,0.102,0.18,1.0);
      bg.gl.clear(bg.gl.COLOR_BUFFER_BIT);
      bg.cleared=true;
    }
    return;
  }
  bg.cleared=false;
  // It is a slow, soft effect — half rate is indistinguishable and halves cost.
  bg.frame++;
  if(bg.frame%2)return;
  if(bg.pulse>0.001)bg.pulse*=0.94; else bg.pulse=0;
  var gl=bg.gl;
  gl.uniform2f(bg.uRes,bg.cv.width,bg.cv.height);
  gl.uniform1f(bg.uTime,(Date.now()-bg.t0)/1000);
  gl.uniform1f(bg.uPulse,bg.pulse);
  gl.uniform1f(bg.uLevel,bg.level);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

// ── Screen shake ─────────────────────────────────────────────────────────────
// Amplitude in pixels, scaled by how big the moment was. Repeat calls take the
// strongest value rather than stacking, so five dice landing at once don't add
// up to a jolt. Decay is time-based so it feels the same at any frame rate.
var shakeAmp=0,shakeRAF=null,shakeLast=0;
function screenShake(amp){
  if(!fxOn('fxShake'))return;
  shakeAmp=Math.max(shakeAmp,amp);
  if(!shakeRAF){
    shakeLast=(window.performance&&performance.now)?performance.now():Date.now();
    shakeRAF=requestAnimationFrame(shakeLoop);
  }
}
function shakeLoop(){
  var app=document.querySelector('.app');
  if(!app){shakeRAF=null;return;}
  var now=(window.performance&&performance.now)?performance.now():Date.now();
  var dt=Math.min(100,now-shakeLast);shakeLast=now;
  shakeAmp*=Math.pow(0.0022,dt/1000);
  if(shakeAmp<0.25){
    shakeAmp=0;app.style.transform='';shakeRAF=null;return;
  }
  var a=shakeAmp;
  app.style.transform='translate('+((Math.random()*2-1)*a).toFixed(2)+'px,'+
                                   ((Math.random()*2-1)*a*0.7).toFixed(2)+'px)';
  shakeRAF=requestAnimationFrame(shakeLoop);
}

// ── Floating score text ──────────────────────────────────────────────────────
function popScore(text,x,y,color,size){
  if(!fxOn('fxJuice'))return;
  var d=document.createElement('div');
  d.className='score-pop';
  d.textContent=text;
  d.style.left=Math.round(x)+'px';
  d.style.top=Math.round(y)+'px';
