// ── Yahtzee celebration ─────────────────────────────────────────
// A riveted steel plate stamps in over a burst of welding sparks and metal
// shards, in keeping with the app's industrial look (no confetti/neon).
// Size, spark count and duration all scale with how many Yahtzees have
// landed this game (1=single, 2=double, 3+=triple).
var yzCanvas,yzCtx,yzParticles=[],yzRAF=null,yzResizeBound=false;
var yzBannerUntil=0;
var YZ_SPARKS=['#f5a623','#ffd479','#fff3d6','#e94560'];
var YZ_SHARDS=['#5b6272','#3a4150','#7a8499'];

// The full-screen canvas is shared: the Yahtzee celebration and the smaller
// burst fired when a category is scored both feed the same particle pool, and
// the loop runs only while something is still alive.
function yzEnsureCanvas(){
  if(!yzCanvas){
    yzCanvas=document.getElementById('yz-canvas');
    if(!yzCanvas)return null;
    yzCtx=yzCanvas.getContext('2d');
  }
  if(!yzResizeBound){window.addEventListener('resize',yzResize);yzResizeBound=true;}
  if(yzCanvas.width!==window.innerWidth||yzCanvas.height!==window.innerHeight)yzResize();
  var el=document.getElementById('yz-celebrate');
  if(el)el.classList.add('show');
  return yzCtx;
}

// Welding sparks and metal shards thrown from a point, in page coordinates.
function yzBurst(cx,cy,scale,sparkN,shardN){
  if(!fxOn('fxParticles'))return;
  var i,a,sp,list=[];
  for(i=0;i<sparkN;i++){
    a=Math.random()*Math.PI*2;sp=(3+Math.random()*7)*scale;
    list.push({type:'spark',x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3*scale,
      len:6+Math.random()*10,color:YZ_SPARKS[(Math.random()*YZ_SPARKS.length)|0],
      life:0,maxLife:30+Math.random()*24});
  }
  for(i=0;i<shardN;i++){
    a=Math.random()*Math.PI*2;sp=(1.5+Math.random()*4)*scale;
    list.push({type:'shard',x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3*scale,
      size:3+Math.random()*5,color:YZ_SHARDS[(Math.random()*YZ_SHARDS.length)|0],
      rot:Math.random()*Math.PI*2,vr:(Math.random()-0.5)*0.35,
      life:0,maxLife:70+Math.random()*40});
  }
  yzParticles=yzParticles.concat(list);
  if(yzEnsureCanvas()&&!yzRAF)yzRAF=requestAnimationFrame(yzLoop);
}

function yzLoop(){
  if(!yzCtx){yzRAF=null;return;}
  yzCtx.clearRect(0,0,yzCanvas.width,yzCanvas.height);
  var alive=[];
  for(var i=0;i<yzParticles.length;i++){
    var p=yzParticles[i];
    if(p.life>p.maxLife)continue;
    alive.push(p);
    p.vy+=0.15;p.x+=p.vx;p.y+=p.vy;p.life++;
    if(p.type==='spark')p.vx*=0.97;
    var fade=1-Math.max(0,(p.life-p.maxLife*0.7)/(p.maxLife*0.3));
    yzCtx.save();
    yzCtx.globalAlpha=Math.max(0,Math.min(1,fade));
    if(p.type==='spark'){
      var spd=Math.hypot(p.vx,p.vy)||1;
      yzCtx.strokeStyle=p.color;yzCtx.lineWidth=1.6;yzCtx.lineCap='round';
      yzCtx.beginPath();yzCtx.moveTo(p.x,p.y);
      yzCtx.lineTo(p.x-(p.vx/spd)*p.len,p.y-(p.vy/spd)*p.len);yzCtx.stroke();
    } else {
      p.rot+=p.vr;
      yzCtx.translate(p.x,p.y);yzCtx.rotate(p.rot);
      yzCtx.fillStyle=p.color;yzCtx.fillRect(-p.size/2,-p.size/3,p.size,p.size*0.65);
    }
    yzCtx.restore();
  }
  yzParticles=alive;
  if(yzParticles.length){yzRAF=requestAnimationFrame(yzLoop);return;}
  yzRAF=null;
  yzCtx.clearRect(0,0,yzCanvas.width,yzCanvas.height);
  // Only pull the overlay once the banner is finished with it too.
  if(Date.now()>yzBannerUntil){
    var el=document.getElementById('yz-celebrate');
    if(el)el.classList.remove('show');
  }
}

function yzResize(){
  if(!yzCanvas)return;
  yzCanvas.width=window.innerWidth;
  yzCanvas.height=window.innerHeight;
}

function celebrateYahtzee(count){
  var el=document.getElementById('yz-celebrate');
  var plate=document.getElementById('yz-plate');
  var banner=document.getElementById('yz-banner');
  var flash=document.getElementById('yz-flash');
  var beaconTop=document.getElementById('yz-beacon-top');
  var beaconBot=document.getElementById('yz-beacon-bottom');
  yzCanvas=document.getElementById('yz-canvas');
  yzCtx=yzCanvas.getContext('2d');
  if(!yzResizeBound){window.addEventListener('resize',yzResize);yzResizeBound=true;}
  yzResize();

  var tier=Math.min(count,3);
  var labels=['YAHTZEE!','DOUBLE YAHTZEE!!','TRIPLE YAHTZEE!!!'];
  var label=count<=3?labels[count-1]:('YAHTZEE x'+count+'!!!');
  // Sparks: hot amber/white streaks. Shards: dark tumbling metal debris.
  var sparkColors=['#f5a623','#ffd479','#fff3d6','#e94560'];
  var shardColors=['#5b6272','#3a4150','#7a8499'];
  var textColors=['#f5a623','#ffb238','#ff6a4d'];

  banner.textContent=label;
  banner.style.fontSize=(tier===1?11:tier===2?13:11.5)+'vw';
  banner.style.color=textColors[tier-1];
  plate.className='yz-plate';
  void plate.offsetWidth; // restart animation
  plate.className='yz-plate stamp';

  el.classList.add('show');
  flash.className='yz-flash';void flash.offsetWidth;flash.className='yz-flash go';
  if(tier>=2){
    beaconTop.className='yz-beacon top';void beaconTop.offsetWidth;beaconTop.className='yz-beacon top go';
    beaconBot.className='yz-beacon bottom';void beaconBot.offsetWidth;beaconBot.className='yz-beacon bottom go';
  }

  var cx=window.innerWidth/2,cy=window.innerHeight*0.4;
  yzBurst(cx,cy,0.85+tier*0.25,45+tier*35,8+tier*8);

  // Chromatic-aberration kick, bigger for double/triple
  if(typeof pulseAberration==='function')pulseAberration(0.0022+tier*0.0016);

  screenShake(5+tier*3.5);
  cameraPush(0.9+tier*0.5);
  sfxYahtzee(tier);
  bgPulse(1);

  var duration=1600+tier*650;
  yzBannerUntil=Date.now()+duration;
  yzEnsureCanvas();
  setTimeout(function(){
    plate.className='yz-plate fade';
    setTimeout(function(){
      plate.className='yz-plate';
      if(!yzParticles.length)el.classList.remove('show');
    },400);
  },duration);
}

function getRankText(score){
  var h=loadHistory();if(h.length<=1)return'First game!';
  var sorted=h.map(function(g){return g.score}).sort(function(a,b){return a-b});
  if(score===sorted[sorted.length-1])return'New personal best!';
  var rank=sorted.filter(function(s){return s<=score}).length;
  return'Better than '+Math.round((rank/sorted.length)*100)+'% of your games';
}

function renderHistoryPanel(){
  var history=loadHistory();
  var statsEl=document.getElementById('hist-stats'),chartWrap=document.getElementById('hist-chart-wrap');
  if(history.length===0){statsEl.innerHTML='';chartWrap.innerHTML='<div class="hist-empty">No games yet!</div>';return}
  var sc=history.map(function(g){return g.score});
  var best=Math.max.apply(null,sc),avg=Math.round(sc.reduce(function(a,b){return a+b},0)/sc.length);
  statsEl.innerHTML='<div class="stat-box"><div class="stat-val">'+history.length+'</div><div class="stat-lbl">Games</div></div><div class="stat-box"><div class="stat-val">'+avg+'</div><div class="stat-lbl">Average</div></div><div class="stat-box"><div class="stat-val">'+best+'</div><div class="stat-lbl">Best</div></div>';
  var BIN=chartBin,minS=Math.floor(Math.min.apply(null,sc)/BIN)*BIN,maxS=Math.ceil(Math.max.apply(null,sc)/BIN)*BIN;
  var lbl2=document.getElementById('bucket-lbl');if(lbl2)lbl2.textContent=BIN+' pt buckets';
  var bins={};for(var b=minS;b<=maxS;b+=BIN)bins[b]=0;
  sc.forEach(function(s){var b=Math.floor(s/BIN)*BIN;bins[b]=(bins[b]||0)+1});
  var binKeys=Object.keys(bins).map(Number).sort(function(a,b){return a-b});
  var maxCnt=Math.max.apply(null,Object.values(bins));
  var W=chartWrap.clientWidth||300,H=chartWrap.clientHeight||170;
  var PAD={top:8,right:8,bottom:36,left:26};
  var plotW=W-PAD.left-PAD.right,plotH=H-PAD.top-PAD.bottom;
  var xStep=plotW/binKeys.length,barW=Math.max(2,xStep-2);
  var latestBin=Math.floor(sc[sc.length-1]/BIN)*BIN;
  var yP=[];
  [0,Math.ceil(maxCnt/2),maxCnt].forEach(function(t){
    var y=PAD.top+plotH-(t/maxCnt)*plotH;
    yP.push('<text x="'+(PAD.left-4)+'" y="'+(y+4)+'" text-anchor="end" font-size="9" fill="#7a8499">'+t+'</text>');
    if(t>0)yP.push('<line x1="'+PAD.left+'" y1="'+y+'" x2="'+(PAD.left+plotW)+'" y2="'+y+'" stroke="rgba(255,255,255,.06)" stroke-width="1"/>');
  });
  var bP=binKeys.map(function(b,i){
    var cnt=bins[b],bh=cnt===0?0:(cnt/maxCnt)*plotH,x=PAD.left+i*xStep+(xStep-barW)/2,y=PAD.top+plotH-bh;
    var isL=b===latestBin,fill=isL?'#e94560':'#378ADD';
    var lbl=cnt>0?'<text x="'+(x+barW/2)+'" y="'+(y-3)+'" text-anchor="middle" font-size="9" fill="'+(isL?'#e94560':'#74b9ff')+'">'+cnt+'</text>':'';
    var xl=(i%2===0||binKeys.length<=8)?'<text x="'+(x+barW/2)+'" y="'+(PAD.top+plotH+14)+'" text-anchor="middle" font-size="8" fill="#7a8499">'+b+'</text>':'';
    return'<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+bh+'" rx="2" fill="'+fill+'" opacity="'+(isL?1:.75)+'"/>'+lbl+xl;
  });
  var axes='<line x1="'+PAD.left+'" y1="'+PAD.top+'" x2="'+PAD.left+'" y2="'+(PAD.top+plotH)+'" stroke="rgba(255,255,255,.15)" stroke-width="1"/><line x1="'+PAD.left+'" y1="'+(PAD.top+plotH)+'" x2="'+(PAD.left+plotW)+'" y2="'+(PAD.top+plotH)+'" stroke="rgba(255,255,255,.15)" stroke-width="1"/>';
  var legend='<rect x="'+PAD.left+'" y="'+(PAD.top+plotH+22)+'" width="8" height="8" rx="1" fill="#e94560"/><text x="'+(PAD.left+11)+'" y="'+(PAD.top+plotH+30)+'" font-size="9" fill="#7a8499">Latest</text><rect x="'+(PAD.left+52)+'" y="'+(PAD.top+plotH+22)+'" width="8" height="8" rx="1" fill="#378ADD"/><text x="'+(PAD.left+63)+'" y="'+(PAD.top+plotH+30)+'" font-size="9" fill="#7a8499">Previous</text>';
  chartWrap.innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+yP.join('')+axes+bP.join('')+legend+'</svg>';
}

// ── Render ─────────────────────────────────────────────────────
var diceWraps={}; // origIdx -> .die-wrap element (persists across renders for Three.js)

function renderDice(){
  var panel=document.getElementById('dice-panel');
  var order=currentSlots();

  // Remove die slots but keep three.js canvases alive
  var existingSlots=panel.querySelectorAll('.die-slot');
  existingSlots.forEach(function(s){s.remove()});

  for(var s=0;s<5;s++){
    (function(slot){
      var origIdx=order.origIdx[slot],v=order.slots[slot],isHeld=order.heldSlots[slot],isEmpty=(v===0);
      var sd=document.createElement('div');sd.className='die-slot';
      var w;
      if(diceWraps[origIdx]){
        w=diceWraps[origIdx];
      } else {
        w=document.createElement('div');
        w.className='die-wrap';
        w.dataset.orig=origIdx;
        diceWraps[origIdx]=w;
      }
      // Held ring
      var existRing=w.querySelector('.held-ring');
      if(isHeld&&!existRing){var ring=document.createElement('div');ring.className='held-ring';w.appendChild(ring);}
      else if(!isHeld&&existRing)existRing.remove();
      // The wrapper is now just the layout box and tap target — the die itself
      // is drawn by the shared stage, which follows this element's position.
      sd.appendChild(w);
      initDiceStage();
      setDieFaces(origIdx,v,isHeld);
      if(stage)stage.needLayout=true;
      w.onclick=(function(oi){return function(){toggleHold(oi)}})(origIdx);
      panel.insertBefore(sd,panel.firstChild);
    })(s);
  }

  // Re-insert slots in correct order (they were prepended, so reverse)
  var slots=panel.querySelectorAll('.die-slot');
  var slotArr=Array.prototype.slice.call(slots);
  slotArr.reverse();
  slotArr.forEach(function(s){panel.appendChild(s)});
  // Remove the prepended ones
  panel.querySelectorAll('.die-slot:not(:nth-last-child(n+3))');

  // Controls
  var existCtrl=panel.querySelector('.dice-controls');
  if(existCtrl)existCtrl.remove();
  var ctrl=document.createElement('div');ctrl.className='dice-controls';
  var pipsEl=document.createElement('div');pipsEl.className='pips';
  for(var i=0;i<MAX_ROLLS;i++){var p=document.createElement('div');p.className='pip'+(i<rollCount?' on':'');pipsEl.appendChild(p)}
  ctrl.appendChild(pipsEl);
  var btn=document.createElement('button');btn.className='btn-roll';
  btn.disabled=(rollCount>=MAX_ROLLS);
  btn.textContent=rollCount===0?'Roll':rollCount<MAX_ROLLS?'Again':'Done';
  btn.onclick=rollDice;
  ctrl.appendChild(btn);
  panel.appendChild(ctrl);

  var existSwap=panel.querySelector('.btn-swap');
  if(existSwap)existSwap.remove();
  var swapBtn=document.createElement('button');
  swapBtn.className='btn-swap';
  swapBtn.textContent=diceRight?'\u2190':'\u2192';
  swapBtn.onclick=swapSides;
  panel.appendChild(swapBtn);
}

// ── Liquid bar physics ───────────────────────────────────────
var liquidState={}; // catId -> {level, vel, waveOff, flame}
var gyroTilt=0; // -1 to 1, from device motion
var gyroListening=false;

// ── Device motion: bar slosh + shake-to-roll ─────────────────────────────────
// iOS 13+ will not deliver devicemotion at all until permission is granted,
// and the request has to come from inside a user gesture. Previously the
// listener was attached with no request, so on iPhone it silently never fired.
var motionState={perm:'unknown',last:{x:0,y:0,z:0},lastT:0,energy:0,lastShake:0};

function motionSupported(){return typeof DeviceMotionEvent!=='undefined';}
function motionNeedsPermission(){
  return motionSupported()&&typeof DeviceMotionEvent.requestPermission==='function';
}

// Sensitivity 1..10 -> how hard you have to shake. Low number = must be firm.
function shakeThreshold(){
  var sens=(currentSettings&&currentSettings.shakeSens)||5;
  return 30-sens*2.2;
}

function onDeviceMotion(e){
  var g=e.accelerationIncludingGravity;
  if(!g)return;
  // tilt still drives the liquid bars
  gyroTilt=Math.max(-1,Math.min(1,(g.x||0)/9.8));
  if(!fxOn('fxShakeRoll'))return;

  var now=Date.now();
  if(now-motionState.lastT<16)return;
  motionState.lastT=now;

  var L=motionState.last;
  var dx=(g.x||0)-L.x,dy=(g.y||0)-L.y,dz=(g.z||0)-L.z;
  L.x=g.x||0;L.y=g.y||0;L.z=g.z||0;
  // Working from the change between samples rather than raw magnitude means
  // gravity cancels itself out and only real movement registers.
  var delta=Math.sqrt(dx*dx+dy*dy+dz*dz);
  motionState.energy=motionState.energy*0.6+delta*0.4;

  if(motionState.energy>shakeThreshold()&&now-motionState.lastShake>900){
    motionState.lastShake=now;
    motionState.energy=0;
    shakeToRoll();
  }
}

function shakeToRoll(){
  if(gameOver||rolling||rollCount>=MAX_ROLLS)return;   // never start a new game by accident
  screenShake(5);
  rollDice();
}

function attachMotion(){
  if(gyroListening||!motionSupported())return;
  gyroListening=true;
  window.addEventListener('devicemotion',onDeviceMotion);
}

// Must be called from inside a tap on iOS. cb gets the resulting state.
function requestMotion(cb){
  if(!motionSupported()){motionState.perm='unsupported';if(cb)cb('unsupported');return;}
  if(!motionNeedsPermission()){
    motionState.perm='granted';attachMotion();
    if(cb)cb('granted');return;
  }
  try{
    DeviceMotionEvent.requestPermission().then(function(res){
      motionState.perm=res;
      if(res==='granted')attachMotion();
      if(cb)cb(res);
    })['catch'](function(){motionState.perm='denied';if(cb)cb('denied');});
  }catch(e){motionState.perm='denied';if(cb)cb('denied');}
}

function initGyro(){attachMotion();}

function animateRowCanvas(canvas,catId,targetLevel,isFlame,isGray){
  // targetLevel: number (gray/used) OR {green,yellow} (active odds) OR 0
  if(canvas._running){
    canvas._targetLevel=targetLevel;
    canvas._isFlame=isFlame;
    canvas._isGray=isGray;
    return;
  }
  canvas._running=true;
  canvas._targetLevel=targetLevel;
  canvas._isFlame=isFlame;
  canvas._isGray=isGray;

  var st=liquidState[catId]||{green:0,yellow:0,gray:0,waveOff:Math.random()*Math.PI*2};
  liquidState[catId]=st;

  var particles=[];
  for(var p=0;p<22;p++){
    particles.push({x:Math.random(),y:Math.random(),vx:(Math.random()-0.5)*0.006,vy:-(0.01+Math.random()*0.02),life:Math.random(),maxLife:0.5+Math.random()*0.5,r:Math.random()*3+2});
  }

  function frame(){
    if(!canvas.isConnected){canvas._running=false;return;}
    requestAnimationFrame(frame);
    var W=canvas.width=canvas.offsetWidth||canvas.clientWidth;
    var H=canvas.height=canvas.offsetHeight||canvas.clientHeight;
    if(!W||!H)return;
    var ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,W,H);

    var tl=canvas._targetLevel;
    var flame=canvas._isFlame;
    var gray=canvas._isGray;

    // Resolve target values
    var tGreen=0,tYellow=0,tGray=0;
    if(typeof tl==='number'){tGray=tl;}
    else if(tl&&typeof tl==='object'){tGreen=tl.green||0;tYellow=tl.yellow||0;}

    // Handoff: when a row locks in, the stone starts at exactly the length the
    // liquid bar was, so selecting a category doesn't make the fill jump or regrow.
    if(gray){
      if(!st.wasGray){
        st.gray=Math.max(st.gray||0,st.green||0,st.yellow||0);
        st.green=0;st.yellow=0;st.gvel=0;st.yvel=0;st.grvel=0;
        st.wasGray=true;
      }
    } else {
      st.wasGray=false;
    }

    // Spring the levels toward targets
    var spring=0.12,damp=0.75;
    st.gvel=(st.gvel||0)+((tGreen-st.green)*spring);st.gvel*=damp;st.green+=st.gvel;
    st.yvel=(st.yvel||0)+((tYellow-st.yellow)*spring);st.yvel*=damp;st.yellow+=st.yvel;
    st.grvel=(st.grvel||0)+((tGray-st.gray)*spring);st.grvel*=damp;st.gray+=st.grvel;
    st.green=Math.max(0,Math.min(1,st.green));
    st.yellow=Math.max(0,Math.min(1,st.yellow));
    st.gray=Math.max(0,Math.min(1,st.gray));
    st.waveOff+=0.05;

    // Vertical tilt from gyro adds a slosh to the liquid surface (in px)
    var slosh=gyroTilt*H*0.35;

    // Horizontal liquid bar drawer (left->right fill, wavy right edge)
    function drawBar(level,colTop,colBot,phase){
      if(level<=0.004)return;
      var barW=level*W;
      ctx.save();
      var grd=ctx.createLinearGradient(0,0,barW,0);
      grd.addColorStop(0,colTop);
      grd.addColorStop(1,colBot);
      ctx.fillStyle=grd;
      // Body with a wavy right edge + tilt slosh on top
      ctx.beginPath();
      ctx.moveTo(0,0);
      // wavy right edge
      var segs=8;
      for(var i=0;i<=segs;i++){
        var yy=i/segs*H;
        var wob=Math.sin(yy*0.15+st.waveOff+phase)*2.2;
        ctx.lineTo(barW+wob,yy);
      }
      ctx.lineTo(0,H);
      ctx.closePath();
      ctx.fill();
      // Shine on top edge (tilt-reactive)
      var sh=ctx.createLinearGradient(0,0,0,H*0.5);
      sh.addColorStop(0,'rgba(255,255,255,0.14)');
      sh.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=sh;
      ctx.fillRect(0,Math.max(0,slosh*0.3),barW,H*0.4);
      ctx.restore();
    }

    if(gray){
      // Stone slab fills only as far as the score got (upper: dice counted / 3)
      var sw=Math.max(0,Math.min(1,st.gray))*W;
      // Empty recess behind the slab so a used row still reads as used at 0
      ctx.fillStyle='rgba(0,0,0,0.22)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle='rgba(255,255,255,0.03)';
      ctx.fillRect(0,H-1,W,1);
      if(sw>0.5){
        ctx.save();
        ctx.beginPath();ctx.rect(0,0,sw,H);ctx.clip();
        var sgrd=ctx.createLinearGradient(0,0,0,H);
        sgrd.addColorStop(0,'#2b2b33');
        sgrd.addColorStop(0.5,'#212127');
        sgrd.addColorStop(1,'#17171c');
        ctx.fillStyle=sgrd;
        ctx.fillRect(0,0,sw,H);
        // Mottled stone speckle (deterministic per catId so it doesn't shimmer)
        if(!st.stoneSpots){
          st.stoneSpots=[];
          var seed=0;for(var ci=0;ci<catId.length;ci++)seed+=catId.charCodeAt(ci);
          function sr(){seed=(seed*9301+49297)%233280;return seed/233280;}
          for(var sp=0;sp<26;sp++){st.stoneSpots.push({x:sr(),y:sr(),r:sr()*2+0.5,l:sr()});}
        }
        st.stoneSpots.forEach(function(s2){
          var shade=s2.l>0.5?255:0;
          ctx.fillStyle='rgba('+shade+','+shade+','+shade+','+(0.04+s2.l*0.05).toFixed(3)+')';
          ctx.beginPath();ctx.arc(s2.x*sw,s2.y*H,s2.r,0,Math.PI*2);ctx.fill();
        });
        // Top bevel highlight + bottom shadow for carved look
        ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(0,0,sw,1.5);
        ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(0,H-2,sw,2);
        // A subtle engraved crack, scaled to the slab
        ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=1;
        ctx.beginPath();
        var cy=H*0.5;ctx.moveTo(sw*0.15,cy);
        ctx.lineTo(sw*0.35,cy-H*0.12);ctx.lineTo(sw*0.55,cy+H*0.1);ctx.lineTo(sw*0.8,cy-H*0.05);
        ctx.stroke();
        ctx.restore();
        // Chiseled right edge of the slab
        ctx.fillStyle='rgba(255,255,255,0.07)';ctx.fillRect(sw-1.5,0,1.5,H);
        ctx.fillStyle='rgba(0,0,0,0.30)';ctx.fillRect(sw,0,2,H);
      }
    } else if(flame){
      // Full-width fiery bar with flame particles
      drawBar(1,'rgba(255,90,0,0.8)','rgba(200,30,0,0.6)',0);
      particles.forEach(function(pt){
        pt.x+=pt.vx+gyroTilt*0.004;
        pt.y+=pt.vy;
        pt.life+=0.03;
        if(pt.life>pt.maxLife||pt.y<-0.05){
          pt.x=Math.random();pt.y=1;pt.vy=-(0.012+Math.random()*0.022);pt.vx=(Math.random()-0.5)*0.006;
          pt.life=0;pt.maxLife=0.4+Math.random()*0.5;pt.r=Math.random()*3+2;
        }
        var tt=pt.life/pt.maxLife;
        var a=(1-tt)*0.8;
        var px=pt.x*W,py=pt.y*H;
        var rr=pt.r*2.4*(1-tt*0.5);
        var g2=ctx.createRadialGradient(px,py,0,px,py,rr);
        g2.addColorStop(0,'rgba(255,240,120,'+a.toFixed(2)+')');
        g2.addColorStop(0.4,'rgba(255,110,20,'+(a*0.7).toFixed(2)+')');
        g2.addColorStop(1,'rgba(255,20,0,0)');
        ctx.fillStyle=g2;
        ctx.beginPath();ctx.arc(px,py,rr,0,Math.PI*2);ctx.fill();
      });
    } else {
      // Green (free odds) behind, yellow (held odds) in front
      drawBar(st.green,'rgba(35,155,72,0.6)','rgba(24,110,52,0.42)',0.5);
      drawBar(st.yellow,'rgba(214,160,12,0.74)','rgba(165,116,6,0.5)',1.2);
    }
  }
  frame();
}

// How much of a category a given score represents (0..1).
// Shared by the final-roll bar and the stone slab so the two are always the same length.
function achievedPct(catId,isUpper,targetNum,scoreVal){
  scoreVal=scoreVal||0;
  if(isUpper)return clamp01(scoreVal/(targetNum*3));           // dice counted / 3
  if(catId==='fh'||catId==='ss'||catId==='ls'||catId==='yh')   // all-or-nothing
    return scoreVal>0?1:0;
  var mx={'3k':18,'4k':24,'ch':30}[catId]||30;                 // sum vs. best possible sum
  return clamp01(scoreVal/mx);
}

function makeRow(cat,isUpper,targetNum,rl){
  var used=scores[cat.id]!==undefined;
  var rolled=rollCount>0;
  var curScore=rolled?cat.fn(dice):null;
  var hasScore=curScore!==null&&curScore>0;
  var catId=cat.id;

  // Joker check
  var js=rolled?jokerState():{active:false};
  var legal=!used&&rolled&&isLegalScore(catId,isUpper);
  var jokerBlocked=!used&&rolled&&js.active&&!legal;

  var row=document.createElement('div');
  row.dataset.cat=catId;
  if(used){
    row.className='score-row used';
    row.style.background='#0d0f1a';
  } else if(jokerBlocked){
    row.className='score-row joker-blocked';
    row.style.background=COL_SURFACE;
    row.style.opacity='0.22';
  } else if(rolled){
    row.className='score-row clickable';
    row.style.background=COL_SURFACE;
  } else {
    row.className='score-row';
    row.style.background=COL_SURFACE;
  }

  // Liquid canvas
  var canvas=document.createElement('canvas');
  canvas.className='row-canvas';
  row.appendChild(canvas);

  var isFlame=false,isGray=false;
  var targetLevel;

  if(used){
    // A selected line is ALWAYS stone — never flame. Only the fill width varies.
    isGray=true;
    isFlame=false;
    targetLevel=achievedPct(catId,isUpper,targetNum,scores[catId]||0);
  } else if(rolled&&!jokerBlocked&&rl===0){
    // No rolls left: odds are meaningless, so show what the dice actually achieved.
    // Same scale as the stone slab, so selecting the row keeps the bar exactly as long.
    var fp=achievedPct(catId,isUpper,targetNum,curScore||0);
    targetLevel={green:fp,yellow:0};
    if(fp>=0.999)isFlame=true;
  } else if(rolled&&!jokerBlocked){
    var dp={held:0,free:0};
    if(isUpper){dp.held=pUpperHeld(targetNum,rl);dp.free=pUpperFree(targetNum,rl);}
    else{dp.held=pLowerHeld(catId,rl);dp.free=pLowerFree(catId,rl);}
    targetLevel={green:clamp01(dp.free),yellow:clamp01(dp.held)};
    if(dp.free>=0.9995)isFlame=true;
  } else {
    targetLevel=0;
  }

  setTimeout(function(){
    initGyro();
    animateRowCanvas(canvas,catId,targetLevel,isFlame,isGray);
  },0);

  var nm=document.createElement('span');nm.className='s-name';
  var nameText=cat.name;
  // Joker indicator labels
  if(js.active&&rolled&&!used){
    if(js.jokerPriority==='upper'&&isUpper&&catId===js.upperCatId){
      nameText=cat.name+' ← joker';
    } else if(js.jokerPriority==='lower'&&!isUpper&&legal){
      nameText=cat.name+' ← joker';
    } else if(js.jokerPriority==='any'&&legal){
      nameText=cat.name+' ← joker';
    }
  }
  // Extra Yahtzee bonus indicator on yh row
  if(catId==='yh'&&scores['yh']===50&&rolled&&isYahtzee(dice)){
    nameText='Yahtzee! +100';
  }
  nm.textContent=nameText;

  var sv=document.createElement('span');
  if(used){
    sv.className='s-val sv-scored';sv.textContent=scores[catId];
  } else if(!rolled||jokerBlocked){
    sv.className='s-val sv-blank';sv.textContent=rolled?'—':'—';
  } else if(hasScore){
    var ph=isUpper?pUpperHeld(targetNum,rl):pLowerHeld(catId,rl);
    sv.className='s-val '+(ph>=.9995?'sv-certain':'sv-avail');
    sv.textContent='+'+curScore;
  } else {
    sv.className='s-val sv-zero';sv.textContent='0';
  }

  row.appendChild(nm);row.appendChild(sv);
  if(legal)row.onclick=function(){claimScore(catId,cat.fn(dice))};
  return row;
}

// Palette of the backdrop drifts from cold steel to warm forge as the card fills.
function syncBackdropLevel(){
  if(!scores)return;
  var filled=UPPER_CATS.concat(LOWER_CATS).filter(function(c){return scores[c.id]!==undefined}).length;
  bgSetLevel(Math.min(1,filled/13));
}
function render(){renderDice();fitDice();renderScorecard();syncBackdropLevel();document.getElementById('total').textContent=calcTotal()}

// ── Settings ─────────────────────────────────────────────────
var SETTINGS_KEY='yahtzee_settings_v2';
// fx* keys are the effect-group toggles (1 = on). Each new effect phase adds
// one here and one button in the settings panel so it can be A/B'd.
var SETTINGS_DEFAULTS={rowHeight:32,headerSize:20,diceScale:100,diceGap:0,diceVshift:0,
  fxLighting:1,fxPost:1,fxParticles:1,fxShake:1,fxJuice:1,fxBackground:1,fxSound:1,fxMusic:0,
  fxShakeRoll:0,shakeSens:5};
var FX_KEYS=['fxLighting','fxPost','fxParticles','fxShake','fxJuice','fxBackground','fxSound','fxMusic','fxShakeRoll'];
function fxOn(key){return !!(currentSettings&&currentSettings[key]);}
var currentSettings={};

function loadSettings(){
  try{
    var s=JSON.parse(localStorage.getItem(SETTINGS_KEY));
    if(s)return Object.assign({},SETTINGS_DEFAULTS,s); // fill in any missing keys
  }catch(e){}
  return Object.assign({},SETTINGS_DEFAULTS);
}
function saveSettings(s){
  try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(s))}catch(e){}
}
function resetSettings(){
  currentSettings=Object.assign({},SETTINGS_DEFAULTS);
  saveSettings(currentSettings);
  syncSliders();
  applySettings();
}
function syncSliders(){
  document.getElementById('sl-row-height').value=currentSettings.rowHeight;
  document.getElementById('sl-header').value=currentSettings.headerSize;
  document.getElementById('sl-dice-size').value=currentSettings.diceScale;
  document.getElementById('sl-dice-gap').value=currentSettings.diceGap;
  document.getElementById('sl-dice-vshift').value=currentSettings.diceVshift;
  document.getElementById('sl-shake-sens').value=currentSettings.shakeSens;
  document.getElementById('lbl-row-height').textContent=currentSettings.rowHeight;
  document.getElementById('lbl-header').textContent=currentSettings.headerSize;
  document.getElementById('lbl-dice-size').textContent=currentSettings.diceScale;
  document.getElementById('lbl-dice-gap').textContent=currentSettings.diceGap;
  document.getElementById('lbl-dice-vshift').textContent=currentSettings.diceVshift;
  document.getElementById('lbl-shake-sens').textContent=currentSettings.shakeSens;
  syncFxToggles();
}
function syncFxToggles(){
  FX_KEYS.forEach(function(k){
    var b=document.getElementById('tg-'+k);
    if(b)b.className='fx-tgl'+(fxOn(k)?' on':'');
  });
}
function toggleFx(key){
  currentSettings[key]=fxOn(key)?0:1;
  saveSettings(currentSettings);
  if(key==='fxShakeRoll'&&currentSettings[key]){
    requestMotion(function(res){
      if(res!=='granted'){
        // Permission refused or unavailable — don't leave a toggle on that
        // cannot possibly work.
        currentSettings.fxShakeRoll=0;
        saveSettings(currentSettings);
        syncFxToggles();
        var btn=document.getElementById('tg-fxShakeRoll');
        if(btn){
          btn.textContent=res==='unsupported'?'No motion sensor':'Motion blocked';
          setTimeout(function(){btn.textContent='Shake to roll';},2200);
        }
      }
    });
  }
  if(key==='fxMusic'){
    if(currentSettings[key]){unlockAudio();startMusic();}
    else stopMusic();
  }
  if(key==='fxSound'&&currentSettings[key])unlockAudio();
  if(key==='fxShake'&&!currentSettings[key]){
    shakeAmp=0;
    if(shakeRAF){cancelAnimationFrame(shakeRAF);shakeRAF=null;}
    var app=document.querySelector('.app');if(app)app.style.transform='';
  }
  syncFxToggles();
  applyFx();
  if(stage)stage.dirty=true;
}
function applySettings(){
  // Read from sliders
  var rh=+document.getElementById('sl-row-height').value;
  var hs=+document.getElementById('sl-header').value;
  var ds=+document.getElementById('sl-dice-size').value;
  var dg=+document.getElementById('sl-dice-gap').value;
  var dv=+document.getElementById('sl-dice-vshift').value;
  var ss=+document.getElementById('sl-shake-sens').value;
  var next={rowHeight:rh,headerSize:hs,diceScale:ds,diceGap:dg,diceVshift:dv,shakeSens:ss};
  // Carry the effect toggles through — the sliders don't own them.
  FX_KEYS.forEach(function(k){next[k]=currentSettings&&currentSettings[k]!==undefined?currentSettings[k]:SETTINGS_DEFAULTS[k];});
  currentSettings=next;
  saveSettings(currentSettings);
  // Update labels
  document.getElementById('lbl-row-height').textContent=rh;
  document.getElementById('lbl-header').textContent=hs;
  document.getElementById('lbl-dice-size').textContent=ds;
  document.getElementById('lbl-dice-gap').textContent=dg;
  document.getElementById('lbl-dice-vshift').textContent=dv;
  document.getElementById('lbl-shake-sens').textContent=ss;
  // Apply via CSS custom properties
  var root=document.documentElement;
  root.style.setProperty('--row-max-height',rh+'px');
  root.style.setProperty('--header-font',hs+'px');
  root.style.setProperty('--dice-vshift',dv+'px');
  // Dice sliders feed fitDice(), which owns the actual sizing
  DIE_SCALE_PCT=ds;
  DIE_GAP_PX=dg;
  fitDice();
  // Header size controls height/padding only — text size stays fixed
  var hdr=document.querySelector('.header');
  if(hdr){
    hdr.style.minHeight=hs+'px';
    hdr.style.paddingTop=Math.round((hs-28)/2)+'px';
    hdr.style.paddingBottom=Math.round((hs-28)/2)+'px';
  }
  // Row height controls the flex-basis / min-height of each row
  var rows=document.querySelectorAll('.score-row');
  for(var i=0;i<rows.length;i++){rows[i].style.minHeight=rh+'px';rows[i].style.flexBasis=rh+'px';}
}
function showSettings(){
  syncSliders();
  document.getElementById('settings-overlay').classList.add('show');
}
function closeSettings(){
  document.getElementById('settings-overlay').classList.remove('show');
}

// Init settings on load
currentSettings=loadSettings();

// Startup waits for the module shim above to publish THREE. Whichever of the
// two runs last kicks this off.
window.__boot=function(){
  if(window.__booted)return;
  window.__booted=true;
  initConstants();
  initBackdrop();
  // iOS only allows audio to start inside a user gesture.
  ['pointerdown','touchend','click'].forEach(function(ev){
    window.addEventListener(ev,unlockAudio,{once:true,passive:true});
  });
  // The toggle persists across reloads, but the motion permission request
  // still has to ride on a gesture, so re-ask on the first tap.
  window.addEventListener('pointerdown',function(){
    if(fxOn('fxShakeRoll'))requestMotion();
  },{once:true,passive:true});
  newGame();
  // Show current version number
  var v=document.getElementById('app-ver');
  if(v&&VERSION_LOG&&VERSION_LOG.length)v.textContent='v'+VERSION_LOG[VERSION_LOG.length-1].v;
  // Apply saved settings after first render
  setTimeout(function(){syncSliders();applySettings()},50);
};
if(window.__threeReady)window.__boot();
</script>
